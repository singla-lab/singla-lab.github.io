<svg viewBox="0 0 40 40" role="img" aria-label="Singla Lab mark: an integral sign" xmlns="http://www.w3.org/2000/svg">
  <!-- Colours stay literal here: build.py also writes this file out as the
       favicon, and a standalone SVG document has no :root to read tokens
       from. The classes let the inline copy in the header follow the theme. -->
  <circle class="lg-bg" cx="20" cy="20" r="18.2" fill="#EAEDF6"/>
  <circle class="lg-ring" cx="20" cy="20" r="18.2" fill="none" stroke="#173F8A" stroke-width="1.5"/>
  <circle class="lg-ring" cx="20" cy="20" r="14.6" fill="none" stroke="#173F8A" stroke-opacity=".3" stroke-width=".7" stroke-dasharray="2 3"/>
  <!-- the integral: the lab's own mark, drawn as a path so it needs no font -->
  <path class="lg-int" d="M26.5 8 C22 5.4, 21.4 11.5, 21 15.5 C20.6 18.5, 19.4 21.5, 19 24.5 C18.6 28.5, 18 34.6, 13.5 32"
        fill="none" stroke="#173F8A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- where LAB sits in the full lockup -->
  <circle class="lg-dot" cx="26.2" cy="27.4" r="2" fill="#B0521A"/>
</svg>
