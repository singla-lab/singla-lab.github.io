<svg viewBox="0 0 320 220" role="img" aria-label="A heterogeneous particle field in which three recurring structures have been discovered without templates and a fourth is still emerging, beside a ranked list of cluster quality scores" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="296" height="196" rx="10" fill="var(--paper)" stroke="var(--rule)"/>

  <text x="26" y="30" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">no templates, no reference</text>

  <!-- everything the tomogram contains, most of it unlabelled -->
  <g fill="var(--ink-4)" fill-opacity=".4">
    <circle cx="34" cy="44" r="2.6"/><circle cx="98" cy="40" r="3"/><circle cx="126" cy="50" r="2.4"/>
    <circle cx="166" cy="42" r="2.8"/><circle cx="180" cy="66" r="2.5"/><circle cx="30" cy="106" r="2.7"/>
    <circle cx="104" cy="110" r="3"/><circle cx="176" cy="112" r="2.6"/><circle cx="34" cy="130" r="2.5"/>
    <circle cx="112" cy="132" r="2.8"/><circle cx="180" cy="136" r="2.4"/><circle cx="30" cy="180" r="2.7"/>
    <circle cx="104" cy="184" r="3"/><circle cx="178" cy="182" r="2.5"/><circle cx="140" cy="190" r="2.6"/>
    <circle cx="60" cy="192" r="2.4"/><circle cx="88" cy="60" r="2.5"/><circle cx="118" cy="164" r="2.6"/>
  </g>

  <!-- class I -->
  <g fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M56 58l8 14H48z"/><path d="M76 70l8 14H68z"/><path d="M54 82l8 14H46z"/>
  </g>
  <circle cx="62" cy="76" r="27" fill="none" stroke="var(--indigo)" stroke-opacity=".5"
          stroke-width="1.1" stroke-dasharray="4 4"/>

  <!-- class II -->
  <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.4">
    <rect x="128" y="68" width="14" height="14" rx="2.5" transform="rotate(14 135 75)"/>
    <rect x="148" y="80" width="14" height="14" rx="2.5" transform="rotate(-10 155 87)"/>
    <rect x="128" y="92" width="14" height="14" rx="2.5" transform="rotate(24 135 99)"/>
  </g>
  <circle class="pulse-o" cx="142" cy="87" r="28" fill="none" stroke="var(--saffron)"
          stroke-opacity=".6" stroke-width="1.1" stroke-dasharray="4 4"/>

  <!-- class III -->
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M66 140l6 3.5v7l-6 3.5-6-3.5v-7z"/>
    <path d="M88 152l6 3.5v7l-6 3.5-6-3.5v-7z"/>
    <path d="M64 164l6 3.5v7l-6 3.5-6-3.5v-7z"/>
  </g>
  <circle cx="74" cy="155" r="27" fill="none" stroke="var(--teal)" stroke-opacity=".5"
          stroke-width="1.1" stroke-dasharray="4 4"/>

  <!-- and one the method has not made up its mind about -->
  <g fill="none" stroke="var(--ink-4)" stroke-width="1.3" stroke-linejoin="round" stroke-opacity=".7">
    <path d="M146 140l8 14h-16z"/><path d="M154 160l8 14h-16z"/>
  </g>
  <circle class="pulse-o" cx="152" cy="157" r="23" fill="none" stroke="var(--ink-4)"
          stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 5" style="animation-delay:-2s"/>

  <line x1="196" y1="34" x2="196" y2="192" stroke="var(--rule)" stroke-width="1"/>

  <!-- the clusters are ranked, not simply returned -->
  <text x="206" y="52" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">cluster quality</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5">
    <rect x="206" y="64" width="8" height="8" rx="2" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.1"/>
    <rect x="220" y="65" width="52" height="6" rx="3" fill="var(--rule-2)"/>
    <rect x="220" y="65" width="44" height="6" rx="3" fill="var(--saffron)"/>
    <text x="278" y="71" fill="var(--ink-4)">.84</text>

    <rect x="206" y="88" width="8" height="8" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.1"/>
    <rect x="220" y="89" width="52" height="6" rx="3" fill="var(--rule-2)"/>
    <rect x="220" y="89" width="37" height="6" rx="3" fill="var(--indigo)"/>
    <text x="278" y="95" fill="var(--ink-4)">.71</text>

    <rect x="206" y="112" width="8" height="8" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.1"/>
    <rect x="220" y="113" width="52" height="6" rx="3" fill="var(--rule-2)"/>
    <rect x="220" y="113" width="28" height="6" rx="3" fill="var(--teal)"/>
    <text x="278" y="119" fill="var(--ink-4)">.53</text>

    <rect x="206" y="136" width="8" height="8" rx="2" fill="none" stroke="var(--ink-4)"
          stroke-width="1.1" stroke-dasharray="2 2"/>
    <rect x="220" y="137" width="52" height="6" rx="3" fill="var(--rule-2)"/>
    <rect x="220" y="137" width="12" height="6" rx="3" fill="var(--ink-4)" fill-opacity=".6"/>
    <text x="278" y="143" fill="var(--ink-4)">.22</text>
  </g>

  <text x="206" y="170" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">ranked, not</text>
  <text x="206" y="181" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">thresholded</text>
</svg>
