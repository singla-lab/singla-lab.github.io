<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: network traffic feeds several different base models, whose outputs are stacked into a meta-learner that decides benign or attack, evaluated across four intrusion-detection datasets" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="46" y="26">traffic</text>
    <text x="126" y="26">base models</text>
    <text x="206" y="26">meta-learner</text>
  </g>

  <!-- flows in -->
  <rect x="14" y="34" width="64" height="70" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke="var(--ink-4)" stroke-opacity=".45" stroke-width="1.1" fill="none">
    <path d="M20 46h52"/><path d="M20 60h52"/><path d="M20 74h52"/><path d="M20 88h52"/>
  </g>
  <g fill="var(--ink-4)" fill-opacity=".55">
    <rect x="26" y="43" width="6" height="6" rx="1.5"/><rect x="48" y="43" width="6" height="6" rx="1.5"/>
    <rect x="34" y="57" width="6" height="6" rx="1.5"/><rect x="60" y="57" width="6" height="6" rx="1.5"/>
    <rect x="22" y="71" width="6" height="6" rx="1.5"/><rect x="52" y="71" width="6" height="6" rx="1.5"/>
    <rect x="40" y="85" width="6" height="6" rx="1.5"/><rect x="64" y="85" width="6" height="6" rx="1.5"/>
  </g>

  <!-- a single model is not enough, so several different ones sit at the first level -->
  <rect x="94" y="34" width="64" height="70" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke-width="1.2">
    <rect x="102" y="40" width="48" height="12" rx="3" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="102" y="56" width="48" height="12" rx="3" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="102" y="72" width="48" height="12" rx="3" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-opacity=".5"/>
    <rect x="102" y="88" width="48" height="12" rx="3" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
  </g>

  <!-- their outputs are stacked, not voted on -->
  <rect x="174" y="34" width="64" height="70" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke="var(--ink-4)" stroke-opacity=".5" stroke-width="1" fill="none">
    <path d="M178 46 C190 46, 190 65, 200 69"/>
    <path d="M178 62 C188 62, 192 66, 200 69"/>
    <path d="M178 78 C188 78, 192 72, 200 69"/>
    <path d="M178 94 C190 94, 190 73, 200 69"/>
  </g>
  <rect x="200" y="56" width="32" height="26" rx="5" fill="var(--surface)" stroke="var(--indigo)"
        stroke-opacity=".5" stroke-width="1.2"/>
  <rect x="205" y="61" width="22" height="16" rx="3" fill="none" stroke="var(--indigo)"
        stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="216" y="72" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">L2</text>

  <g stroke="var(--ink-4)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 69h10 M86 66l3.5 3-3.5 3"/>
    <path d="M160 69h10 M166 66l3.5 3-3.5 3"/>
    <path d="M240 69h8 M244 66l3.5 3-3.5 3"/>
  </g>

  <rect x="252" y="46" width="40" height="18" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="272" y="58" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--teal)">benign</text>
  <rect x="252" y="74" width="40" height="18" rx="5" fill="var(--saffron-soft)" stroke="var(--saffron)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="272" y="86" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--saffron)">attack</text>

  <line x1="14" y1="116" x2="286" y2="116" stroke="var(--rule)" stroke-width="1"/>

  <text x="14" y="136" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">evaluated on</text>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)"
     text-anchor="middle">
    <rect x="82" y="124" width="48" height="16" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="106" y="135">5G-NIDD</text>
    <rect x="136" y="124" width="48" height="16" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="160" y="135">UNR-IDD</text>
    <rect x="190" y="124" width="48" height="16" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="214" y="135">N-BaIoT</text>
    <rect x="244" y="124" width="48" height="16" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="268" y="135">NSL-KDD</text>
  </g>

  <text x="14" y="164" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-3)">a nested stack, not one model</text>
</svg>
