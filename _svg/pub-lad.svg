<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: binary patterns in two classes are separated by a disjunctive normal form rule of three-literal terms, whose VC dimension stays under a bound and so does not overfit" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">two classes, binary rules</text>
    <text x="286" y="24" text-anchor="end">no overfitting</text>
  </g>

  <!-- ===== the data is 0/1 and the label is +/- ===== -->
  <rect x="14" y="32" width="104" height="76" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--ink-4)" fill-opacity=".45">
    <rect x="22" y="42" width="10" height="8" rx="1.5"/><rect x="46" y="42" width="10" height="8" rx="1.5"/>
    <rect x="70" y="42" width="10" height="8" rx="1.5"/>
    <rect x="34" y="52" width="10" height="8" rx="1.5"/><rect x="58" y="52" width="10" height="8" rx="1.5"/>
    <rect x="70" y="52" width="10" height="8" rx="1.5"/><rect x="82" y="52" width="10" height="8" rx="1.5"/>
    <rect x="22" y="62" width="10" height="8" rx="1.5"/><rect x="58" y="62" width="10" height="8" rx="1.5"/>
    <rect x="82" y="62" width="10" height="8" rx="1.5"/>
    <rect x="34" y="72" width="10" height="8" rx="1.5"/><rect x="46" y="72" width="10" height="8" rx="1.5"/>
    <rect x="22" y="82" width="10" height="8" rx="1.5"/><rect x="70" y="82" width="10" height="8" rx="1.5"/>
    <rect x="46" y="92" width="10" height="8" rx="1.5"/><rect x="82" y="92" width="10" height="8" rx="1.5"/>
  </g>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".3" stroke-width=".8">
    <rect x="22" y="42" width="10" height="8" rx="1.5"/><rect x="34" y="42" width="10" height="8" rx="1.5"/>
    <rect x="46" y="42" width="10" height="8" rx="1.5"/><rect x="58" y="42" width="10" height="8" rx="1.5"/>
    <rect x="70" y="42" width="10" height="8" rx="1.5"/><rect x="82" y="42" width="10" height="8" rx="1.5"/>
    <rect x="22" y="52" width="10" height="8" rx="1.5"/><rect x="34" y="52" width="10" height="8" rx="1.5"/>
    <rect x="46" y="52" width="10" height="8" rx="1.5"/><rect x="58" y="52" width="10" height="8" rx="1.5"/>
    <rect x="70" y="52" width="10" height="8" rx="1.5"/><rect x="82" y="52" width="10" height="8" rx="1.5"/>
    <rect x="22" y="62" width="10" height="8" rx="1.5"/><rect x="34" y="62" width="10" height="8" rx="1.5"/>
    <rect x="46" y="62" width="10" height="8" rx="1.5"/><rect x="58" y="62" width="10" height="8" rx="1.5"/>
    <rect x="70" y="62" width="10" height="8" rx="1.5"/><rect x="82" y="62" width="10" height="8" rx="1.5"/>
    <rect x="22" y="72" width="10" height="8" rx="1.5"/><rect x="34" y="72" width="10" height="8" rx="1.5"/>
    <rect x="46" y="72" width="10" height="8" rx="1.5"/><rect x="58" y="72" width="10" height="8" rx="1.5"/>
    <rect x="70" y="72" width="10" height="8" rx="1.5"/><rect x="82" y="72" width="10" height="8" rx="1.5"/>
    <rect x="22" y="82" width="10" height="8" rx="1.5"/><rect x="34" y="82" width="10" height="8" rx="1.5"/>
    <rect x="46" y="82" width="10" height="8" rx="1.5"/><rect x="58" y="82" width="10" height="8" rx="1.5"/>
    <rect x="70" y="82" width="10" height="8" rx="1.5"/><rect x="82" y="82" width="10" height="8" rx="1.5"/>
    <rect x="22" y="92" width="10" height="8" rx="1.5"/><rect x="34" y="92" width="10" height="8" rx="1.5"/>
    <rect x="46" y="92" width="10" height="8" rx="1.5"/><rect x="58" y="92" width="10" height="8" rx="1.5"/>
    <rect x="70" y="92" width="10" height="8" rx="1.5"/><rect x="82" y="92" width="10" height="8" rx="1.5"/>
  </g>
  <g stroke-width="1.5" stroke-linecap="round">
    <path d="M98 46h8 M102 42v8" stroke="var(--teal)"/>
    <path d="M98 56h8 M102 52v8" stroke="var(--teal)"/>
    <path d="M98 66h8 M102 62v8" stroke="var(--teal)"/>
    <path d="M98 76h8" stroke="var(--saffron)"/>
    <path d="M98 86h8" stroke="var(--saffron)"/>
    <path d="M98 96h8" stroke="var(--saffron)"/>
  </g>

  <!-- ===== the classifier is a short Boolean formula ===== -->
  <text x="130" y="52" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">DNF, three literals a term</text>
  <rect x="130" y="58" width="156" height="32" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".45" stroke-width="1.2"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--indigo)"
     text-anchor="middle">
    <text x="208" y="71">(x1 &amp; !x3 &amp; x7)</text>
    <text x="208" y="84">| (x2 &amp; x5 &amp; !x9)</text>
  </g>
  <text x="130" y="106" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">optimized, yet stable</text>

  <line x1="14" y1="118" x2="286" y2="118" stroke="var(--rule)" stroke-width="1"/>

  <text x="14" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">capacity</text>
  <line x1="70" y1="126" x2="200" y2="126" stroke="var(--ink-4)" stroke-width="1.4"
        stroke-dasharray="4 3"/>
  <text x="206" y="122" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">VC bound</text>
  <rect x="90" y="130" width="90" height="12" rx="3" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-width="1.2"/>
  <text x="286" y="139" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--teal)">stays under</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="164" font-size="8" fill="var(--ink-3)">small DNFs cannot overfit</text>
    <text x="14" y="180" font-size="8" fill="var(--ink-4)">argued from VC dimension, checked empirically</text>
  </g>
</svg>
