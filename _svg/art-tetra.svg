<svg viewBox="0 0 320 220" role="img" aria-label="Tetrahedral building blocks composing into a larger molecular assembly" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="296" height="196" rx="10" fill="var(--paper)" stroke="var(--rule)"/>

  <!-- single primitive -->
  <g>
    <path d="M72 62 L96 104 L48 104 Z" fill="var(--indigo)" fill-opacity=".1" stroke="var(--indigo)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M72 62 L74 92 M96 104 L74 92 M48 104 L74 92" fill="none" stroke="var(--indigo)" stroke-width=".9" stroke-opacity=".5"/>
    <circle cx="74" cy="92" r="2.8" fill="var(--saffron)"/>
  </g>
  <text x="72" y="128" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">primitive</text>

  <g stroke="var(--ink-4)" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M112 96 h22 M128 90 l6 6 l-6 6"/>
  </g>

  <!-- assembly -->
  <circle cx="212" cy="104" r="74" fill="none" stroke="var(--indigo)" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 6"/>
  <g class="spin-tetra">
    <g fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.4" stroke-linejoin="round">
      <path d="M212 56 L226 80 L198 80 Z"/>
      <path d="M254 80 L268 104 L240 104 Z"/>
      <path d="M254 128 L268 152 L240 152 Z"/>
      <path d="M212 152 L226 176 L198 176 Z"/>
      <path d="M170 128 L184 152 L156 152 Z"/>
      <path d="M170 80 L184 104 L156 104 Z"/>
    </g>
    <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3" stroke-linejoin="round">
      <path d="M212 90 L223 110 L201 110 Z"/>
      <path d="M234 124 L245 144 L223 144 Z"/>
      <path d="M190 124 L201 144 L179 144 Z"/>
    </g>
  </g>
  <circle cx="212" cy="104" r="3" fill="var(--saffron)"/>
  <text x="212" y="198" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">assembly</text>
</svg>
