<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: soft X-rays pass through an unstained intact cell, and the distances between insulin vesicles and mitochondria are measured, together with their morphology, composition and position" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">intact cell, no stain</text>
    <text x="286" y="24" text-anchor="end">distance to mitochondria</text>
  </g>

  <line x1="146" y1="32" x2="146" y2="112" stroke="var(--rule)" stroke-width="1"/>

  <!-- ===== the beam goes through a whole cell; contrast is the carbon itself ===== -->
  <g stroke="var(--ink-4)" stroke-opacity=".38" stroke-width="1.1" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46h28 M39 43l3 3-3 3"/>
    <path d="M14 58h28 M39 55l3 3-3 3"/>
    <path d="M14 70h28 M39 67l3 3-3 3"/>
    <path d="M14 82h28 M39 79l3 3-3 3"/>
    <path d="M14 94h28 M39 91l3 3-3 3"/>
  </g>
  <text x="14" y="108" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">x-rays</text>

  <circle cx="92" cy="70" r="34" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1"/>
  <circle cx="80" cy="58" r="12" fill="var(--ink-4)" fill-opacity=".13"/>
  <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.2">
    <rect x="94" y="64" width="22" height="9" rx="4.5" transform="rotate(-18 105 68.5)"/>
    <rect x="78" y="84" width="20" height="8" rx="4" transform="rotate(14 88 88)"/>
  </g>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.1">
    <circle cx="104" cy="84" r="3.4"/><circle cx="118" cy="78" r="3.4"/>
    <circle cx="100" cy="98" r="3.4"/><circle cx="70" cy="80" r="3.4"/>
    <circle cx="66" cy="68" r="3.4"/>
  </g>

  <!-- ===== one mitochondrion, and how far each vesicle sits from it ===== -->
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".3" stroke-width="1" stroke-dasharray="3 3">
    <ellipse cx="221" cy="71" rx="34" ry="24"/>
    <ellipse cx="221" cy="71" rx="52" ry="36"/>
  </g>
  <rect x="200" y="62" width="42" height="18" rx="9" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-width="1.3"/>
  <path d="M206 71l5-4 5 8 5-8 5 8 5-8 5 4" fill="none" stroke="var(--saffron)"
        stroke-opacity=".5" stroke-width="1"/>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.3">
    <circle cx="221" cy="44" r="6"/><circle cx="185" cy="84" r="6"/>
    <circle cx="263" cy="88" r="6"/><circle cx="256" cy="50" r="6"/>
    <circle cx="221" cy="102" r="6"/><circle cx="247" cy="71" r="6"/>
  </g>
  <g fill="var(--teal)" fill-opacity=".38">
    <circle cx="221" cy="44" r="2.6"/><circle cx="185" cy="84" r="2.6"/>
    <circle cx="263" cy="88" r="2.6"/><circle cx="256" cy="50" r="2.6"/>
    <circle cx="221" cy="102" r="2.6"/><circle cx="247" cy="71" r="2.6"/>
  </g>

  <line x1="14" y1="122" x2="286" y2="122" stroke="var(--rule)" stroke-width="1"/>

  <text x="14" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">quantified</text>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)"
     text-anchor="middle">
    <rect x="74" y="130" width="64" height="18" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="106" y="142">morphology</text>
    <rect x="144" y="130" width="70" height="18" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="179" y="142">composition</text>
    <rect x="220" y="130" width="66" height="18" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
    <text x="253" y="142">position</text>
  </g>

  <circle cx="20" cy="165" r="5" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2"/>
  <rect x="112" y="160" width="16" height="9" rx="4.5" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-width="1.2"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-3)">
    <text x="30" y="168">insulin vesicle</text>
    <text x="134" y="168">mitochondrion</text>
    <text x="286" y="168" text-anchor="end" fill="var(--ink-4)">time and stimuli</text>
  </g>
</svg>
