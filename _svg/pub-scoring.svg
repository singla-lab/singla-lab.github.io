<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a cluster of subtomograms containing both misaligned particles and a wrong complex, and a ranking of more than fifteen scoring functions in which two come out on top" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <path id="pscp" d="M-9 -6 h12 a7 7 0 0 1 0 13 h-12 z"/>
    <path id="psch" d="M9 0 L4.5 7.79 L-4.5 7.79 L-9 0 L-4.5 -7.79 L4.5 -7.79 Z"/>
  </defs>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">subtomogram cluster</text>
    <text x="286" y="24" text-anchor="end">15+ scoring functions</text>
  </g>

  <!-- ===== the cluster is never clean: some particles sit wrong, some do not belong ===== -->
  <rect x="14" y="32" width="124" height="76" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.3">
    <use href="#pscp" transform="translate(40 54)"/>
    <use href="#pscp" transform="translate(66 54)"/>
    <use href="#pscp" transform="translate(40 82)"/>
    <use href="#pscp" transform="translate(66 82)"/>
    <use href="#pscp" transform="translate(104 54) rotate(48)" stroke-dasharray="3 2"/>
  </g>
  <use href="#psch" transform="translate(104 82)" fill="var(--saffron-soft)"
       stroke="var(--saffron)" stroke-width="1.3"/>

  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2">
    <use href="#pscp" transform="translate(22 121) scale(.5)"/>
    <use href="#pscp" transform="translate(22 137) scale(.5)" stroke-dasharray="3 2"/>
  </g>
  <use href="#psch" transform="translate(22 153) scale(.56)" fill="var(--saffron-soft)"
       stroke="var(--saffron)" stroke-width="1.2"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-4)">
    <text x="32" y="124">aligned</text>
    <text x="32" y="140">misaligned</text>
    <text x="32" y="156">wrong complex</text>
  </g>

  <path d="M150 70h10 M156 66.5l3.5 3.5-3.5 3.5" fill="none" stroke="var(--ink-4)"
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== every score is asked to rank the same clusters; two hold up ===== -->
  <g fill="var(--indigo)" fill-opacity=".8">
    <rect x="176" y="32" width="108" height="5.5" rx="2"/>
    <rect x="176" y="40.5" width="102.3" height="5.5" rx="2"/>
  </g>
  <g fill="var(--ink-4)" fill-opacity=".28">
    <rect x="176" y="49" width="96.6" height="5.5" rx="2"/>
    <rect x="176" y="57.5" width="90.9" height="5.5" rx="2"/>
    <rect x="176" y="66" width="85.2" height="5.5" rx="2"/>
    <rect x="176" y="74.5" width="79.5" height="5.5" rx="2"/>
    <rect x="176" y="83" width="73.8" height="5.5" rx="2"/>
    <rect x="176" y="91.5" width="68.1" height="5.5" rx="2"/>
    <rect x="176" y="100" width="62.4" height="5.5" rx="2"/>
    <rect x="176" y="108.5" width="56.7" height="5.5" rx="2"/>
    <rect x="176" y="117" width="51" height="5.5" rx="2"/>
    <rect x="176" y="125.5" width="45.3" height="5.5" rx="2"/>
    <rect x="176" y="134" width="39.6" height="5.5" rx="2"/>
    <rect x="176" y="142.5" width="33.9" height="5.5" rx="2"/>
    <rect x="176" y="151" width="28.2" height="5.5" rx="2"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="end">
    <text x="286" y="170" fill="var(--indigo)">SSNR-FSC and Fourier PC lead</text>
    <text x="286" y="182" fill="var(--ink-4)">robust at any SNR, unfiltered</text>
  </g>
</svg>
