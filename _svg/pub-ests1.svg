<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: the EstS1 esterase with a substrate caught in its active-site tunnel, beside the reaction it runs — BHET to MHET to terephthalate, releasing ethylene glycol at each step" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">EstS1 active site</text>

  <!-- the fold, drawn only as far as it needs to be: a body with a way in -->
  <path d="M40 34 C70 26, 108 38, 118 66 C126 94, 104 124, 74 126 C42 128, 20 106, 20 78
           C20 52, 26 40, 40 34 Z" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke-width="1.1">
    <rect x="30" y="44" width="28" height="9" rx="4.5" transform="rotate(-14 44 48.5)"
          fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".45"/>
    <rect x="84" y="98" width="26" height="9" rx="4.5" transform="rotate(20 97 102.5)"
          fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".45"/>
  </g>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".45" stroke-width="1.1"
     stroke-linejoin="round">
    <path d="M28 106 h18 l0 -4.5 l8 6.5 l-8 6.5 l0 -4.5 h-18 Z"/>
    <path d="M78 44 h16 l0 -4.5 l8 6.5 l-8 6.5 l0 -4.5 h-16 Z"/>
  </g>

  <!-- the tunnel, cut open so the reader can see down it -->
  <path d="M116 70 C100 64, 84 74, 72 88" fill="none" stroke="var(--ink-4)" stroke-opacity=".22"
        stroke-width="17" stroke-linecap="round"/>
  <path d="M116 70 C100 64, 84 74, 72 88" fill="none" stroke="var(--surface)" stroke-width="13"
        stroke-linecap="round"/>

  <!-- residues lining the far end of it -->
  <g stroke="var(--saffron)" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".85">
    <path d="M64 94 l4 -4"/><path d="M70 99 l4 -4"/><path d="M61 102 l5 -2"/>
  </g>

  <!-- the substrate, caught in there -->
  <polygon points="92,75 87.7,77.5 87.7,82.5 92,85 96.3,82.5 96.3,77.5"
           fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.2"/>
  <g stroke="var(--indigo)" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".8">
    <path d="M92 75 l3 -5"/><path d="M92 85 l-3 5"/>
  </g>

  <text x="14" y="144" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">substrate in the tunnel</text>

  <!-- ============ right: the reaction it runs ============ -->
  <text x="140" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">BHET &#8594; terephthalate</text>

  <polygon points="160,51 150.5,56.5 150.5,67.5 160,73 169.5,67.5 169.5,56.5"
           fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.3"/>
  <g stroke="var(--indigo)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M160 51 v-7 l7 -4"/><path d="M160 73 v7 l-7 4"/>
  </g>

  <polygon points="214,51 204.5,56.5 204.5,67.5 214,73 223.5,67.5 223.5,56.5"
           fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
  <g stroke="var(--saffron)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M214 51 v-7 l7 -4"/><path d="M214 73 v9"/><path d="M211 82 h6"/>
  </g>

  <polygon points="268,51 258.5,56.5 258.5,67.5 268,73 277.5,67.5 277.5,56.5"
           fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.3"/>
  <g stroke="var(--teal)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M268 51 v-9"/><path d="M265 42 h6"/><path d="M268 73 v9"/><path d="M265 82 h6"/>
  </g>

  <g stroke="var(--ink-4)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M182 62h14 M191 59l3.5 3-3.5 3"/>
    <path d="M236 62h14 M245 59l3.5 3-3.5 3"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="189" y="52" fill="var(--ink-3)">EstS1</text>
    <text x="243" y="52" fill="var(--ink-3)">EstS1</text>
    <text x="189" y="78" fill="var(--ink-4)">+ EG</text>
    <text x="243" y="78" fill="var(--ink-4)">+ EG</text>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" text-anchor="middle">
    <text x="160" y="104" fill="var(--indigo)">BHET</text>
    <text x="214" y="104" fill="var(--saffron)">MHET</text>
    <text x="268" y="104" fill="var(--teal)">TPA</text>
  </g>

  <line x1="14" y1="152" x2="286" y2="152" stroke="var(--rule)" stroke-width="1"/>

  <rect x="17" y="158" width="5" height="12" rx="2.5" fill="var(--surface)" stroke="var(--ink-4)"
        stroke-width="1"/>
  <circle cx="19.5" cy="173" r="4" fill="var(--saffron-soft)" stroke="var(--ink-4)" stroke-width="1"/>
  <rect x="18.5" y="163" width="2" height="9" fill="var(--saffron)"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-3)">
    <text x="32" y="176">thermostable</text>
    <text x="286" y="176" text-anchor="end">does not stall at MHET</text>
  </g>
</svg>
