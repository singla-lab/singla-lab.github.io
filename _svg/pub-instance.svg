<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: organelles fused into a single mask are split into separate instances using the intensity dip between them in the raw tomogram" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">one merged mask</text>
    <text x="286" y="24" text-anchor="end">separate instances</text>
  </g>

  <!-- ===== two organelles that the mask cannot tell apart ===== -->
  <rect x="14" y="32" width="120" height="64" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <path d="M58 40 C66 40, 70 44, 74 47 C78 44, 82 40, 90 40 C100 40, 106 47, 106 55
           C106 63, 100 70, 90 70 C82 70, 78 66, 74 63 C70 66, 66 70, 58 70
           C48 70, 42 63, 42 55 C42 47, 48 40, 58 40 Z"
        fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4"/>
  <rect x="40" y="78" width="68" height="13" rx="6.5" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-width="1.4"/>

  <path d="M140 64h10 M146 60.5l3.5 3.5-3.5 3.5" fill="none" stroke="var(--ink-4)"
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== after the split ===== -->
  <rect x="160" y="32" width="126" height="64" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4">
    <circle cx="205" cy="55" r="16"/><circle cx="241" cy="55" r="16"/>
  </g>
  <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.4">
    <rect x="168" y="78" width="52" height="13" rx="6.5"/>
    <rect x="226" y="78" width="52" height="13" rx="6.5"/>
  </g>

  <line x1="14" y1="104" x2="286" y2="104" stroke="var(--rule)" stroke-width="1"/>

  <!-- ===== the raw grey values decide where the cut goes ===== -->
  <text x="14" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">raw intensity decides the split</text>
  <text x="14" y="138" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">intensity</text>

  <line x1="62" y1="164" x2="282" y2="164" stroke="var(--rule)" stroke-width="1"/>
  <path d="M66 160 C80 160, 88 130, 106 130 C124 130, 130 152, 148 152 C166 152, 174 130, 192 130
           C210 130, 218 160, 232 160 C252 160, 262 161, 280 161"
        fill="none" stroke="var(--ink-3)" stroke-width="1.5"/>
  <line x1="148" y1="124" x2="148" y2="170" stroke="var(--teal)" stroke-width="1.3"
        stroke-dasharray="3 3"/>
  <text x="148" y="180" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--teal)">split</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-4)">
    <text x="14" y="180">sphere-like and columnar</text>
    <text x="286" y="180" text-anchor="end">improves on watershed</text>
  </g>
</svg>
