<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: the Ser-His-Asp triad of EstS1 attacking a phthalate diester, beside a Cleland diagram of the bi-bi ping-pong mechanism in which the enzyme returns unchanged" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">Ser-His-Asp</text>
    <text x="286" y="24" text-anchor="end">bi-bi ping-pong</text>
  </g>

  <line x1="138" y1="32" x2="138" y2="116" stroke="var(--rule)" stroke-width="1"/>

  <!-- ===== the triad, and the ester it opens ===== -->
  <path d="M66 40 L72 43.5 L72 50.5 L66 54 L60 50.5 L60 43.5 Z" fill="var(--paper-2)"
        stroke="var(--ink-3)" stroke-width="1.2"/>
  <path d="M72 47h10 M82 47v-5" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/>
  <text x="90" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">DEHP</text>

  <path d="M46 78 L60 56" fill="none" stroke="var(--teal)" stroke-width="1.1" stroke-dasharray="3 2"/>

  <g fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 92 v-8 l6 -4" stroke="var(--teal)"/>
    <path d="M104 92 v-8 l-5 -4 M104 84 l5 -4" stroke="var(--saffron)"/>
  </g>
  <path d="M72 68 L77 71 L75 77 L69 77 L67 71 Z" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-width="1.3"/>
  <g stroke="var(--ink-4)" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2.5 2">
    <path d="M47 80 L66 74"/><path d="M78 74 L98 80"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="40" y="104" fill="var(--teal)">Ser</text>
    <text x="72" y="104" fill="var(--indigo)">His</text>
    <text x="104" y="104" fill="var(--saffron)">Asp</text>
  </g>
  <text x="14" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">tetrahedral intermediate</text>

  <!-- ===== two half-reactions, the enzyme handed back at the end ===== -->
  <line x1="152" y1="80" x2="282" y2="80" stroke="var(--ink-3)" stroke-width="1.4"/>
  <g fill="none" stroke="var(--ink-4)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 60v16 M168.5 72.5l3.5 3.5 3.5-3.5"/>
    <path d="M208 76v-16 M204.5 63.5l3.5-3.5 3.5 3.5"/>
    <path d="M236 60v16 M232.5 72.5l3.5 3.5 3.5-3.5"/>
    <path d="M266 76v-16 M262.5 63.5l3.5-3.5 3.5 3.5"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="172" y="54" fill="var(--teal)">DEHP</text>
    <text x="208" y="54" fill="var(--ink-4)">alcohol</text>
    <text x="236" y="54" fill="var(--teal)">water</text>
    <text x="266" y="54" fill="var(--ink-4)">product</text>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="158" y="94">E</text>
    <text x="217" y="94">F</text>
    <text x="276" y="94">E</text>
  </g>
  <text x="146" y="112" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">enzyme returns unchanged</text>

  <line x1="14" y1="126" x2="286" y2="126" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="146" font-size="8.5" fill="var(--ink-3)">a tunnel in, a tunnel out</text>
    <text x="14" y="166" font-size="8" fill="var(--ink-4)">Met207Ala abolishes binding</text>
    <text x="286" y="166" font-size="8" fill="var(--ink-4)" text-anchor="end">apo and bound structures</text>
  </g>
</svg>
