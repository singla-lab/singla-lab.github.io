<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: mitochondria of three morphotypes segmented in a whole beta cell, beside a triangle joining structure, density and location to show the three are coupled rather than independent" xmlns="http://www.w3.org/2000/svg">

  <!-- ============ left: what is measured ============ -->
  <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">SXT &#183; &#946;-cell</text>

  <!-- whole intact cell: SXT needs no fixation and no sectioning -->
  <circle cx="74" cy="100" r="52" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".45"
          stroke-width="1.2" stroke-dasharray="2 4"/>
  <circle cx="74" cy="96" r="20" fill="var(--indigo-soft)" stroke="var(--indigo)"
          stroke-opacity=".4" stroke-width="1.1"/>
  <text x="74" y="99" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)" fill-opacity=".7">N</text>

  <!-- morphotype I, punctate -->
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4">
    <circle cx="50" cy="62" r="3.6"/><circle cx="64" cy="54" r="3"/>
    <circle cx="36" cy="76" r="3.2"/><circle cx="98" cy="62" r="3.4"/>
  </g>
  <!-- morphotype II, discrete rods -->
  <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.4">
    <rect x="30" y="110" width="22" height="8" rx="4" transform="rotate(-30 41 114)"/>
    <rect x="46" y="132" width="24" height="8" rx="4" transform="rotate(12 58 136)"/>
    <rect x="91" y="120" width="22" height="8" rx="4" transform="rotate(-42 102 124)"/>
  </g>
  <!-- morphotype III, connected network -->
  <g fill="none" stroke="var(--indigo)" stroke-width="4.5" stroke-linecap="round"
     stroke-linejoin="round" stroke-opacity=".85">
    <path d="M104 88 C116 96, 114 110, 106 118 M106 118 L114 124"/>
    <path d="M54 140 C66 146, 76 142, 84 146"/>
  </g>

  <g stroke="var(--ink-4)" stroke-width="1.2" stroke-linecap="round">
    <path d="M20 162h24"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="48" y="165">2 &#181;m</text>
    <text x="20" y="180">three morphotypes</text>
  </g>

  <line x1="146" y1="28" x2="146" y2="168" stroke="var(--rule)" stroke-width="1"/>

  <!-- ============ right: the result, as the title states it ============ -->
  <!-- the edges go behind the three nodes, which are opaque -->
  <g stroke="var(--ink-4)" stroke-opacity=".45" stroke-width="1.4">
    <path d="M222 60 L178 138 M222 60 L266 138 M178 138 L266 138"/>
  </g>
  <text x="222" y="107" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--ink-3)">coupled</text>

  <!-- node: structure -->
  <rect x="192" y="44" width="60" height="32" rx="9" fill="var(--paper-2)" stroke="var(--rule)"/>
  <circle cx="206" cy="55" r="3" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.3"/>
  <rect x="214.5" y="52.5" width="11" height="5" rx="2.5" transform="rotate(-12 220 55)"
        fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
  <path d="M230 51 L234 55 L239 53 M234 55 L233 60" fill="none" stroke="var(--indigo)"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="222" y="70" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--ink-2)">structure</text>

  <!-- node: density -->
  <rect x="148" y="122" width="60" height="32" rx="9" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--teal)" fill-opacity=".8">
    <circle cx="163" cy="129" r="2.2"/><circle cx="167" cy="133" r="2.2"/>
    <circle cx="162" cy="136" r="2.2"/><circle cx="170" cy="128" r="2.2"/>
    <circle cx="169" cy="137" r="2.2"/>
    <circle cx="181" cy="130" r="2.2"/><circle cx="191" cy="135" r="2.2"/>
  </g>
  <text x="178" y="148" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--ink-2)">density</text>

  <!-- node: location, read as distance out from the nucleus -->
  <rect x="236" y="122" width="60" height="32" rx="9" fill="var(--paper-2)" stroke="var(--rule)"/>
  <circle cx="259" cy="133" r="3.5" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1"/>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2 2.5">
    <path d="M259 125 A8 8 0 0 1 259 141"/>
    <path d="M259 122 A11 11 0 0 1 259 144"/>
  </g>
  <circle cx="266" cy="128" r="2.6" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2"/>
  <circle cx="272" cy="138" r="2.6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.2"/>
  <text x="266" y="148" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--ink-2)">location</text>
</svg>
