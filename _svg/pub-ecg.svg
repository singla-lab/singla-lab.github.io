<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a reduced set of ECG leads is encoded into a latent space organised by cardiac pathology rather than by anatomy, and decoded back to the full twelve leads, cutting patient-independent reconstruction error by about seventy-six per cent on PTB-XL" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">a few leads</text>
    <text x="286" y="16" text-anchor="end">all twelve</text>
  </g>

  <!-- ===== in: a reduced lead set ===== -->
  <g fill="none" stroke="var(--ink-3)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 32h6l2-5 3 12 3-7h8"/>
    <path d="M14 50h6l2-5 3 12 3-7h8"/>
    <path d="M14 68h6l2-5 3 12 3-7h8"/>
  </g>

  <path d="M44 50h12 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== the latent space, pulled into shape by pathology and not by anatomy ===== -->
  <rect x="62" y="24" width="94" height="60" rx="8" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g>
    <circle cx="86" cy="42" r="3.2" fill="var(--indigo)" fill-opacity=".75"/>
    <circle cx="93" cy="47" r="3.2" fill="var(--indigo)" fill-opacity=".75"/>
    <circle cx="81" cy="50" r="3.2" fill="var(--indigo)" fill-opacity=".75"/>
    <circle cx="89" cy="54" r="3.2" fill="var(--indigo)" fill-opacity=".75"/>
    <circle cx="126" cy="60" r="3.2" fill="var(--teal)" fill-opacity=".75"/>
    <circle cx="133" cy="55" r="3.2" fill="var(--teal)" fill-opacity=".75"/>
    <circle cx="121" cy="52" r="3.2" fill="var(--teal)" fill-opacity=".75"/>
    <circle cx="130" cy="66" r="3.2" fill="var(--teal)" fill-opacity=".75"/>
  </g>
  <text x="109" y="78" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--ink-4)">pathology clusters</text>

  <!-- anatomy is the nuisance variable, and is deliberately thrown away -->
  <g stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round">
    <path d="M166 40l9 9 M175 40l-9 9"/>
  </g>
  <text x="170" y="60" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--ink-4)">anatomy</text>

  <path d="M186 50h12 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== out: twelve leads, precordial morphology intact ===== -->
  <g fill="none" stroke="var(--teal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 30h4l1.5-4 2 9 2-5h5"/>
    <path d="M234 30h4l1.5-4 2 9 2-5h5"/>
    <path d="M262 30h4l1.5-4 2 9 2-5h5"/>
    <path d="M206 48h4l1.5-4 2 9 2-5h5"/>
    <path d="M234 48h4l1.5-4 2 9 2-5h5"/>
    <path d="M262 48h4l1.5-4 2 9 2-5h5"/>
    <path d="M206 66h4l1.5-4 2 9 2-5h5"/>
    <path d="M234 66h4l1.5-4 2 9 2-5h5"/>
    <path d="M262 66h4l1.5-4 2 9 2-5h5"/>
    <path d="M206 84h4l1.5-4 2 9 2-5h5"/>
    <path d="M234 84h4l1.5-4 2 9 2-5h5"/>
    <path d="M262 84h4l1.5-4 2 9 2-5h5"/>
  </g>

  <!-- ===== the error that is left ===== -->
  <text x="14" y="108" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">RMSE, patient-independent, PTB-XL</text>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-3)">
    <text x="14" y="124">previous best</text>
    <text x="14" y="139">this</text>
  </g>
  <rect x="88" y="117" width="170" height="9" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".45" stroke-width="1"/>
  <rect x="88" y="132" width="41" height="9" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".55" stroke-width="1"/>
  <text x="264" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-4)">100%</text>
  <text x="135" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--teal)">~24%</text>

  <line x1="14" y1="150" x2="286" y2="150" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="166" font-size="8.5" fill="var(--ink-3)">anatomy filtered, pathology kept</text>
    <text x="14" y="181" font-size="8" fill="var(--ink-4)">holds on PTB Diagnostic Database</text>
  </g>
</svg>
