<svg viewBox="0 0 320 220" role="img" aria-label="A beta cell tomogram with mitochondria segmented and coloured by morphotype, beside a plot in which the three morphotypes occupy distinct regions of a density against location plane" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="296" height="196" rx="10" fill="var(--surface)" stroke="var(--rule)"/>

  <!-- whole intact cell, as SXT sees it: no fixation, no sectioning -->
  <circle cx="84" cy="104" r="62" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".5"
          stroke-width="1.2" stroke-dasharray="2 4"/>
  <circle cx="84" cy="100" r="25" fill="var(--indigo-soft)" stroke="var(--indigo)"
          stroke-opacity=".45" stroke-width="1.2"/>
  <text x="84" y="103" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)" fill-opacity=".75">N</text>

  <!-- morphotype I — punctate -->
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4">
    <circle cx="56" cy="58" r="4"/><circle cx="72" cy="50" r="3.4"/>
    <circle cx="42" cy="76" r="3.6"/><circle cx="112" cy="56" r="3.8"/>
  </g>
  <!-- morphotype II — discrete rods -->
  <g fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.5">
    <rect x="28" y="112" width="24" height="9" rx="4.5" transform="rotate(-28 40 116)"/>
    <rect x="46" y="142" width="26" height="9" rx="4.5" transform="rotate(14 59 146)"/>
    <rect x="106" y="138" width="24" height="9" rx="4.5" transform="rotate(-40 118 142)"/>
  </g>
  <!-- morphotype III — connected network -->
  <g fill="none" stroke="var(--indigo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
     stroke-opacity=".85">
    <path d="M120 84 C 134 92, 132 110, 122 120 M122 120 L138 132"/>
    <path d="M74 152 C 88 160, 104 158, 116 166"/>
  </g>

  <!-- one morphometric read-out, the measurement the pipeline exists to make -->
  <rect x="110" y="74" width="40" height="54" rx="3" fill="none" stroke="var(--saffron)"
        stroke-width="1" stroke-dasharray="3 3"/>
  <text x="110" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--saffron)">2.4 µm</text>

  <g stroke="var(--ink-4)" stroke-width="1.2" stroke-linecap="round">
    <path d="M26 186h26"/>
  </g>
  <text x="56" y="189" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">2 µm</text>

  <!-- the result: morphotypes are not scattered at random through the plane -->
  <line x1="176" y1="62" x2="176" y2="170" stroke="var(--rule)" stroke-width="1"/>
  <text x="188" y="54" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">density &#215; location</text>

  <g stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1" fill="none">
    <path d="M196 72v92h100"/>
  </g>
  <g fill="var(--ink-4)" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5">
    <text x="196" y="178">distance from nucleus</text>
    <text x="190" y="70" transform="rotate(-90 190 70)" text-anchor="end">density</text>
  </g>

  <g stroke-width="1.2">
    <ellipse cx="224" cy="140" rx="17" ry="13" fill="var(--teal-soft)" stroke="var(--teal)"/>
    <ellipse cx="276" cy="128" rx="16" ry="12" fill="var(--saffron-soft)" stroke="var(--saffron)"/>
    <ellipse class="pulse-o" cx="248" cy="96" rx="19" ry="14" fill="var(--indigo-soft)" stroke="var(--indigo)"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" text-anchor="middle">
    <text x="224" y="143" fill="var(--teal)">I</text>
    <text x="276" y="131" fill="var(--saffron)">II</text>
    <text x="248" y="99" fill="var(--indigo)">III</text>
  </g>
</svg>
