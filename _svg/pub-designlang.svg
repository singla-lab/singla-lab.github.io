  <!-- ===== the same form, spoken in tetrahedra ===== -->
  <rect x="152" y="32" width="134" height="76" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".55" stroke-width="1.2">
    <path d="M176 43 L167.5 58 L184.5 58 Z"/><path d="M198 37 L189.5 52 L206.5 52 Z"/>
    <path d="M220 45 L211.5 60 L228.5 60 Z"/><path d="M186 65 L177.5 80 L194.5 80 Z"/>
    <path d="M210 65 L201.5 80 L218.5 80 Z"/><path d="M236 61 L227.5 76 L244.5 76 Z"/>
    <path d="M196 87 L187.5 102 L204.5 102 Z"/><path d="M220 85 L211.5 100 L228.5 100 Z"/>
  </g>
  <g fill="none" stroke="var(--indigo)" stroke-opacity=".35" stroke-width=".9">
