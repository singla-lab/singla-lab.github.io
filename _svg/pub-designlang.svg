    <path d="M198 37 L199.5 47 M189.5 52 L199.5 47 M206.5 52 L199.5 47"/>
    <path d="M220 45 L221.5 55 M211.5 60 L221.5 55 M228.5 60 L221.5 55"/>
    <path d="M186 65 L187.5 75 M177.5 80 L187.5 75 M194.5 80 L187.5 75"/>
    <path d="M210 65 L211.5 75 M201.5 80 L211.5 75 M218.5 80 L211.5 75"/>
    <path d="M236 61 L237.5 71 M227.5 76 L237.5 71 M244.5 76 L237.5 71"/>
