  <line x1="14" y1="118" x2="286" y2="118" stroke="var(--rule)" stroke-width="1"/>

  <rect x="14" y="126" width="100" height="20" rx="6" fill="var(--paper-2)" stroke="var(--rule)"/>
  <text x="64" y="140" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
