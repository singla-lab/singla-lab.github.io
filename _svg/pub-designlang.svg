<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a molecule drawn as a crowd of atoms alongside the same form rebuilt from tetrahedral building blocks, the visual language behind the World in a Cell experience" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">atoms and surfaces</text>
    <text x="286" y="24" text-anchor="end">tetrahedral blocks</text>
  </g>

  <!-- ===== the crowded way: every atom drawn, nothing to spare for animation ===== -->
  <rect x="14" y="32" width="110" height="76" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--ink-4)" fill-opacity=".22" stroke="var(--ink-4)" stroke-opacity=".35" stroke-width=".9">
    <circle cx="58" cy="46" r="5"/><circle cx="69" cy="46" r="5"/><circle cx="80" cy="46" r="5"/>
    <circle cx="47" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="69" cy="58" r="5"/>
    <circle cx="80" cy="58" r="5"/><circle cx="91" cy="58" r="5"/>
    <circle cx="41" cy="70" r="5"/><circle cx="52" cy="70" r="5"/><circle cx="63" cy="70" r="5"/>
    <circle cx="74" cy="70" r="5"/><circle cx="85" cy="70" r="5"/><circle cx="97" cy="70" r="5"/>
    <circle cx="47" cy="82" r="5"/><circle cx="58" cy="82" r="5"/><circle cx="69" cy="82" r="5"/>
    <circle cx="80" cy="82" r="5"/><circle cx="91" cy="82" r="5"/>
    <circle cx="58" cy="94" r="5"/><circle cx="69" cy="94" r="5"/><circle cx="80" cy="94" r="5"/>
  </g>

  <path d="M130 70h10 M136 66.5l3.5 3.5-3.5 3.5" fill="none" stroke="var(--ink-4)"
