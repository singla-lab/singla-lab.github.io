<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A kernel sliding over an input grid into a stack of feature maps" xmlns="http://www.w3.org/2000/svg">
  <!-- input plane -->
  <rect x="22" y="34" width="112" height="112" rx="4" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
  <g stroke="var(--rule)" stroke-width="1">
    <path d="M50 34v112M78 34v112M106 34v112"/>
    <path d="M22 62h112M22 90h112M22 118h112"/>
  </g>

  <!-- the receptive field, sitting on one 2x2 of the grid -->
  <rect x="50" y="62" width="56" height="56" rx="3" fill="var(--saffron)" fill-opacity=".14"
        stroke="var(--saffron)" stroke-width="2"/>
  <g stroke="var(--saffron)" stroke-width="1.4" stroke-opacity=".65">
    <path d="M78 62v56M50 90h56"/>
  </g>

  <!-- what it maps to -->
  <g fill="none" stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1.3">
    <path d="M106 68 L196 46"/>
    <path d="M106 112 L196 62"/>
  </g>

  <!-- feature maps, stacked back to front -->
  <g stroke-width="1.5">
    <rect x="212" y="30" width="76" height="76" rx="4" fill="var(--indigo-soft)" stroke="var(--indigo)" opacity=".45"/>
    <rect x="200" y="46" width="76" height="76" rx="4" fill="var(--indigo-soft)" stroke="var(--indigo)" opacity=".7"/>
    <rect x="188" y="62" width="76" height="76" rx="4" fill="var(--indigo-soft)" stroke="var(--indigo)"/>
  </g>
  <!-- activations on the front map -->
  <g fill="var(--teal)" fill-opacity=".7">
    <rect x="200" y="74" width="14" height="14" rx="2"/>
    <rect x="228" y="88" width="14" height="14" rx="2"/>
    <rect x="214" y="112" width="14" height="14" rx="2"/>
    <rect x="242" y="74" width="14" height="14" rx="2"/>
  </g>

  <!-- instrument ticks -->
  <g stroke="var(--ink-4)" stroke-width="1.2" stroke-linecap="round" opacity=".55">
    <path d="M10 10h12M10 10v12"/>
    <path d="M310 170h-12M310 170v-12"/>
  </g>
</svg>
