<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a Hindi-Sanskrit corpus of ninety-two thousand pairs drawn from spoken tutorials, children's magazines, radio and instruction material, overlapping barely at all with existing corpora" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">Hindi &#8596; Sanskrit</text>
    <text x="286" y="24" text-anchor="end">92,196 pairs</text>
  </g>

  <rect x="14" y="38" width="48" height="20" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="38" y="52" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--saffron)">Hindi</text>
  <rect x="84" y="38" width="56" height="20" rx="6" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="112" y="52" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--teal)">Sanskrit</text>
  <path d="M66 48h14 M70 44.5l-3.5 3.5 3.5 3.5 M76 51.5l3.5-3.5-3.5-3.5" fill="none"
        stroke="var(--ink-4)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== not classical poetry: the everyday registers ===== -->
  <text x="14" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">curated from</text>

  <path d="M18 76 h11 a3 3 0 0 1 3 3 v5 a3 3 0 0 1 -3 3 h-6 l-4 4 v-4 h-1 a3 3 0 0 1 -3 -3 v-5
           a3 3 0 0 1 3 -3 z" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".6"
        stroke-width="1"/>
  <g fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".6" stroke-width="1">
    <rect x="15" y="92" width="15" height="12" rx="1.5"/>
    <rect x="15" y="124" width="15" height="12" rx="1.5"/>
  </g>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".6" stroke-width="1">
    <path d="M22.5 92v12"/>
    <path d="M16 114a7 7 0 0 1 13 0 M19 114a4 4 0 0 1 7 0"/>
    <path d="M18 128h9 M18 131h9 M18 134h6"/>
  </g>
  <circle cx="22.5" cy="114" r="1.6" fill="var(--ink-4)"/>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)">
    <text x="38" y="87">spoken tutorials</text>
    <text x="38" y="103">children's magazines</text>
    <text x="38" y="119">radio conversations</text>
    <text x="38" y="135">instruction material</text>
  </g>

  <!-- ===== and it barely overlaps what already existed ===== -->
  <circle cx="196" cy="62" r="30" fill="var(--teal-soft)" fill-opacity=".65" stroke="var(--teal)"
          stroke-width="1.3"/>
  <circle cx="248" cy="62" r="26" fill="var(--ink-4)" fill-opacity=".16" stroke="var(--ink-4)"
          stroke-opacity=".6" stroke-width="1.2"/>
  <line x1="222" y1="112" x2="222" y2="70" stroke="var(--ink-4)" stroke-opacity=".5"
        stroke-width="1" stroke-dasharray="3 3"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="190" y="104" fill="var(--teal)">Samas&#257;mayik</text>
    <text x="252" y="104" fill="var(--ink-4)">existing</text>
    <text x="222" y="122" fill="var(--ink-4)">minimal overlap</text>
  </g>

  <line x1="14" y1="142" x2="286" y2="142" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="160" font-size="8.5" fill="var(--ink-3)">contemporary Sanskrit, not classical</text>
    <text x="14" y="178" font-size="8" fill="var(--ink-4)">ByT5 &#183; NLLB &#183; IndicTrans-v2</text>
  </g>
</svg>
