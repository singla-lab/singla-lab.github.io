<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: from a prompt naming a problem family and a size, the OptiScribe challenger writes 64 MILP instances; a frozen SCIP verifier checks that each is valid, then presolves it, solves the root relaxation, adds root cuts and runs branch-and-bound. The post-cut gap and the node count, read after the solver's own repairs, feed the GRPO reward that trains the challenger. Over base Gemma-4-12B, OptiScribe-12B raises median SCIP nodes 1.7 to 5.0 times and post-cut gap 1.1 to 1.7 times, and feasibility on capacitated facility location by 9 to 19 points, with no seed instances and no solver needed at generation; the gains hold up to 500 variables and under HiGHS and Gurobi" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">family + size, in words</text>
    <text x="286" y="16" text-anchor="end">a hard, feasible MILP</text>
  </g>

  <!-- ===== the learner: the only part of the loop that is trained ===== -->
  <rect x="14" y="23" width="64" height="24" rx="6" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-3)" text-anchor="middle">
    <text x="46" y="32.5">&#8220;max-cut,</text>
    <text x="46" y="42">171&#8211;225 vars&#8221;</text>
  </g>

  <path d="M81 35h8 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="92" y="22" width="90" height="26" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".55" stroke-width="1.2"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" fill="var(--indigo)" text-anchor="middle">
    <text x="137" y="33.5" font-size="8.5">OptiScribe</text>
    <text x="137" y="43" font-size="6.5">challenger, trained</text>
  </g>

  <!-- the reward comes back into the challenger, and nowhere else -->
  <rect x="202" y="24" width="84" height="22" rx="6" fill="none" stroke="var(--saffron)" stroke-width="1.3"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" fill="var(--saffron)" text-anchor="middle">
    <text x="244" y="33.5" font-size="8">reward</text>
    <text x="244" y="42.5" font-size="6.5">via GRPO</text>
  </g>
  <path d="M199 35H186 M189 32l-3 3 3 3" fill="none" stroke="var(--saffron)" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- down into the verifier: a group of instances per prompt, compared with each other -->
  <path d="M107 50v14 M104 61l3 3 3-3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="113" y="59.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5"
        fill="var(--ink-4)">64 per prompt</text>

  <!-- ===== the verifier: SCIP at one fixed setting, never trained, so the scale never moves ===== -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" fill="var(--teal)">
    <text x="14" y="75.5" font-size="8">SCIP</text>
    <text x="14" y="84.5" font-size="6.5">verifier, frozen</text>
  </g>

  <rect x="92" y="68" width="30" height="18" rx="5" fill="none" stroke="var(--ink-4)"
        stroke-opacity=".6" stroke-width="1.1"/>
  <text x="107" y="79.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="6.5" fill="var(--ink-3)">valid?</text>
  <path d="M124 77h5 M127 75l2 2-2 2" fill="none" stroke="var(--ink-4)" stroke-opacity=".7" stroke-width="1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the solve, in the order it runs. what presolve and cuts repair earns little -->
  <rect x="132" y="68" width="154" height="18" rx="5" fill="var(--paper-2)"/>
  <path d="M230 68h51a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-51z" fill="var(--teal-soft)"/>
  <line x1="186" y1="68" x2="186" y2="86" stroke="var(--rule)" stroke-width="1"/>
  <line x1="230" y1="68" x2="230" y2="86" stroke="var(--teal)" stroke-opacity=".5" stroke-width="1"/>
  <rect x="132" y="68" width="154" height="18" rx="5" fill="none" stroke="var(--teal)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5" text-anchor="middle">
    <text x="159" y="79.5" fill="var(--ink-3)">presolve, LP</text>
    <text x="208" y="79.5" fill="var(--ink-3)">root cuts</text>
    <text x="258" y="79.5" fill="var(--teal)">B&amp;B search</text>
  </g>
  <path d="M133 90v2.5H229V90" fill="none" stroke="var(--ink-4)" stroke-opacity=".6" stroke-width="1"/>
  <text x="181" y="100.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="6.5" fill="var(--ink-3)">the solver&#8217;s own repairs</text>

  <!-- the readout, taken only once the repairs are done: what is left of the gap, and the search -->
  <path d="M230 66V50 M227 53l3-3 3 3 M276 66V50 M273 53l3-3 3 3" fill="none" stroke="var(--teal)"
        stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5" fill="var(--teal)" text-anchor="end">
    <text x="226" y="60">post-cut gap</text>
    <text x="272" y="60">nodes</text>
  </g>

  <!-- ===== what the loop buys, against the model it started from ===== -->
  <text x="14" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">OptiScribe-12B over base Gemma-4-12B, on SCIP</text>
  <g stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1.1" fill="var(--indigo-soft)">
    <rect x="14" y="121" width="78" height="16" rx="6"/>
    <rect x="100" y="121" width="78" height="16" rx="6"/>
    <rect x="186" y="121" width="100" height="16" rx="6"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--indigo)" text-anchor="middle">
    <text x="53" y="131.5">nodes 1.7&#8211;5.0&#215;</text>
    <text x="139" y="131.5">gap 1.1&#8211;1.7&#215;</text>
    <text x="236" y="131.5">CFL feasible +9&#8211;19 pts</text>
  </g>

  <line x1="14" y1="147" x2="286" y2="147" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="163" font-size="8.5" fill="var(--ink-3)">no seed instances, no solver at generation</text>
    <text x="14" y="179" font-size="8" fill="var(--ink-4)">gains hold to 500 vars, and on HiGHS and Gurobi</text>
  </g>
</svg>
