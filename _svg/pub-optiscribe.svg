<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a language model writes a MILP instance from a natural-language instruction, a solver reports both whether it is feasible and what it cost to solve in branch-and-bound nodes and post-cut gap, and that cost becomes the reward that trains the model to write harder instances" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">an instruction in words</text>
    <text x="286" y="16" text-anchor="end">an instance that is hard</text>
  </g>

  <!-- ===== challenger and verifier, with nothing seeding either ===== -->
  <rect x="14" y="24" width="58" height="20" rx="6" fill="var(--paper-2)" stroke="var(--rule)"/>
  <text x="43" y="37" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--ink-3)">&#8220;max-cut&#8221;</text>

  <path d="M76 34h10 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="90" y="22" width="76" height="24" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".55" stroke-width="1.2"/>
  <text x="128" y="37" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">OptiScribe-12B</text>

  <path d="M170 34h10 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="184" y="24" width="30" height="20" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
  <text x="199" y="37" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--ink-3)">MILP</text>

  <path d="M218 34h10 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="232" y="22" width="54" height="24" rx="6" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-opacity=".55" stroke-width="1.2"/>
  <text x="259" y="37" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--teal)">solver</text>

  <!-- what the solver already knows, and nobody was reading: the cost of the search -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" text-anchor="middle">
    <rect x="190" y="56" width="96" height="14" rx="5" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".45" stroke-width="1"/>
    <text x="238" y="66" fill="var(--teal)">branch-and-bound nodes</text>
    <rect x="190" y="74" width="96" height="14" rx="5" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".45" stroke-width="1"/>
    <text x="238" y="84" fill="var(--teal)">post-cut gap</text>
  </g>
  <path d="M259 48v6" fill="none" stroke="var(--teal)" stroke-opacity=".6" stroke-width="1.1" stroke-linecap="round"/>

  <!-- the loop: cost becomes reward, and the challenger is asked again -->
  <path d="M190 81 C156 81, 140 72, 128 52 m-3.5 5 3.5-5 4 4" fill="none" stroke="var(--saffron)"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="166" y="76" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--saffron)">reward</text>
  <text x="14" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">no seed instances,</text>
  <text x="14" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">no MILP training data</text>

  <!-- ===== what the self-play buys, against the base model ===== -->
  <text x="14" y="104" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">against base Gemma, on SCIP</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <rect x="14" y="110" width="84" height="18" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1.1"/>
    <text x="56" y="122" fill="var(--indigo)">nodes 1.7&#8211;5&#215;</text>
    <rect x="106" y="110" width="84" height="18" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1.1"/>
    <text x="148" y="122" fill="var(--indigo)">gap 1.1&#8211;1.7&#215;</text>
    <rect x="198" y="110" width="88" height="18" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-opacity=".6" stroke-width="1.1"/>
    <text x="242" y="122" fill="var(--saffron)">feasible +9&#8211;19</text>
  </g>

  <line x1="14" y1="144" x2="286" y2="144" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="160" font-size="8.5" fill="var(--ink-3)">the solver grades its own challenger</text>
    <text x="14" y="177" font-size="8" fill="var(--ink-4)">still hard for HiGHS and Gurobi</text>
  </g>
</svg>
