<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary of a pipeline: a stack of soft X-ray tomograms is segmented into a mitochondrial mask, the mask is split into individual organelles, and each organelle is profiled for volume, surface, sphericity and branching" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- the same three organelles are carried through all three panels, so the
         reader can see they are the same objects being segmented and split -->
    <ellipse id="pmsb1" cx="44" cy="52" rx="13" ry="6" transform="rotate(-24 44 52)"/>
    <ellipse id="pmsb2" cx="72" cy="74" rx="9" ry="5.5" transform="rotate(26 72 74)"/>
    <path id="pmsb3" d="M34 74 C42 80, 52 74, 60 82 M46 77 L44 88" fill="none"
          stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="57" y="20">SXT volumes</text>
    <text x="150" y="20">segmentation</text>
    <text x="243" y="20">instances</text>
  </g>

  <!-- panel 1: several raw tomograms, grey and unlabelled -->
  <g fill="var(--paper-2)" stroke="var(--rule)">
    <rect x="14" y="24" width="74" height="66" rx="4"/>
    <rect x="17" y="27" width="74" height="66" rx="4"/>
    <rect x="20" y="30" width="74" height="66" rx="4"/>
  </g>
  <g fill="var(--ink-4)">
    <ellipse cx="30" cy="40" rx="3.4" ry="2.4" opacity=".22"/>
    <ellipse cx="45" cy="37" rx="2.6" ry="3.2" opacity=".16"/>
    <ellipse cx="60" cy="42" rx="4" ry="2.2" opacity=".2"/>
    <ellipse cx="76" cy="38" rx="2.8" ry="2.8" opacity=".14"/>
    <ellipse cx="86" cy="46" rx="3.2" ry="2.4" opacity=".2"/>
    <ellipse cx="27" cy="55" rx="2.4" ry="3.4" opacity=".17"/>
    <ellipse cx="58" cy="62" rx="3.6" ry="2.2" opacity=".15"/>
    <ellipse cx="84" cy="60" rx="2.6" ry="3" opacity=".19"/>
    <ellipse cx="31" cy="90" rx="3.8" ry="2.2" opacity=".18"/>
    <ellipse cx="52" cy="92" rx="2.6" ry="2.6" opacity=".14"/>
    <ellipse cx="70" cy="88" rx="3.2" ry="2.4" opacity=".2"/>
    <ellipse cx="86" cy="80" rx="2.4" ry="3.2" opacity=".16"/>
    <ellipse cx="40" cy="66" rx="2.4" ry="2.4" opacity=".13"/>
    <ellipse cx="66" cy="52" rx="2.6" ry="2.2" opacity=".12"/>
  </g>
  <g opacity=".3" fill="var(--ink-3)" stroke="var(--ink-3)" stroke-width="1">
    <use href="#pmsb1"/><use href="#pmsb2"/>
  </g>
  <use href="#pmsb3" stroke="var(--ink-3)" opacity=".3"/>

  <g stroke="var(--ink-4)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 63h9 M104 60l3.5 3-3.5 3"/>
    <path d="M191 63h9 M197 60l3.5 3-3.5 3"/>
  </g>

  <!-- panel 2: one class, cleanly separated from the background -->
  <rect x="113" y="30" width="74" height="66" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g transform="translate(93 0)" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4">
    <use href="#pmsb1"/><use href="#pmsb2"/>
  </g>
  <use href="#pmsb3" transform="translate(93 0)" stroke="var(--teal)" stroke-opacity=".85"/>

  <!-- panel 3: the mask split into individual organelles -->
  <rect x="206" y="30" width="74" height="66" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g transform="translate(186 0)">
    <use href="#pmsb1" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.4"/>
    <use href="#pmsb2" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.4"/>
    <use href="#pmsb3" stroke="var(--indigo)" stroke-opacity=".85"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="230" y="54" fill="var(--teal)">1</text>
    <text x="258" y="77" fill="var(--saffron)">2</text>
    <text x="232" y="93" fill="var(--indigo)">3</text>
  </g>

  <!-- what each individuated organelle is then measured for -->
  <line x1="20" y1="110" x2="280" y2="110" stroke="var(--rule)" stroke-width="1"/>
  <text x="20" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9"
        fill="var(--ink-4)">morphological profiling</text>

  <ellipse cx="52" cy="147" rx="12" ry="7.5" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.3"/>

  <ellipse cx="117" cy="147" rx="9" ry="5.5" fill="none" stroke="var(--saffron)" stroke-width="1.6"/>
  <ellipse cx="117" cy="147" rx="13" ry="9" fill="none" stroke="var(--saffron)" stroke-width="1"
           stroke-opacity=".55" stroke-dasharray="2 2.5"/>

  <circle cx="182" cy="147" r="11" fill="none" stroke="var(--indigo)" stroke-opacity=".5"
          stroke-width="1" stroke-dasharray="2 2.5"/>
  <path d="M175 145 C177 138, 187 138, 189 145 C191 152, 179 155, 175 145 Z"
        fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.3"/>

  <g fill="none" stroke="var(--indigo)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M239 155 L247 148 L255 142 M247 148 L255 154"/>
  </g>
  <g fill="var(--indigo)">
    <circle cx="239" cy="155" r="2.2"/><circle cx="255" cy="142" r="2.2"/><circle cx="255" cy="154" r="2.2"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="52" y="174">volume</text>
    <text x="117" y="174">surface</text>
    <text x="182" y="174">sphericity</text>
    <text x="247" y="174">branching</text>
  </g>
</svg>
