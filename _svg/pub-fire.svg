<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a periodic network in which every neuron shares one global frequency, contrasted with one where a low-rank gate gives each neuron its own, and the effect on optimization conditioning shown as elongated contours becoming near-circular" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="18" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">per-neuron frequency</text>

  <!-- every neuron on the same global omega -->
  <text x="14" y="43" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-3)">SIREN</text>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round">
    <path d="M66 40 q5.5 -9 11 0 t11 0 t11 0 t11 0"/>
    <path d="M122 40 q5.5 -9 11 0 t11 0 t11 0 t11 0"/>
    <path d="M178 40 q5.5 -9 11 0 t11 0 t11 0 t11 0"/>
    <path d="M234 40 q5.5 -9 11 0 t11 0 t11 0 t11 0"/>
  </g>

  <!-- each neuron gets its own, bounded and input-dependent -->
  <text x="14" y="79" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-2)">FiRe</text>
  <g fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M66 76 q11 -11 22 0 t22 0" stroke="var(--indigo)"/>
    <path d="M122 76 q5.5 -9 11 0 t11 0 t11 0 t11 0" stroke="var(--teal)"/>
    <path d="M178 76 q3.14 -8 6.29 0 t6.29 0 t6.29 0 t6.29 0 t6.29 0 t6.29 0 t6.29 0"
          stroke="var(--saffron)"/>
    <path d="M234 76 q2.2 -7 4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0 t4.4 0"
          stroke="var(--indigo)"/>
  </g>

  <text x="66" y="98" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">a low-rank gate sets each &#969;</text>

  <line x1="14" y1="110" x2="286" y2="110" stroke="var(--rule)" stroke-width="1"/>

  <!-- what that buys: the loss surface the optimiser actually sees at init -->
  <text x="14" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">conditioning at init</text>
  <text x="286" y="126" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--ink-3)">converges sooner</text>

  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".5" stroke-width="1">
    <ellipse cx="100" cy="152" rx="42" ry="13"/>
    <ellipse cx="100" cy="152" rx="29" ry="9"/>
    <ellipse cx="100" cy="152" rx="16" ry="5"/>
  </g>
  <path d="M62 144 L84 160 L74 148 L92 157 L88 150 L100 152" fill="none" stroke="var(--saffron)"
        stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>

  <g stroke="var(--ink-4)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 152h20 M168 149l3.5 3-3.5 3"/>
  </g>

  <g fill="none" stroke="var(--indigo)" stroke-opacity=".45" stroke-width="1">
    <circle cx="214" cy="152" r="24"/><circle cx="214" cy="152" r="16"/><circle cx="214" cy="152" r="8"/>
  </g>
  <path d="M192 138 L214 152" fill="none" stroke="var(--teal)" stroke-width="1.6"
        stroke-linecap="round"/>
  <path d="M209 147l5 5-1 -6.6" fill="var(--teal)"/>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="100" y="182">ill-conditioned</text>
    <text x="214" y="182">preconditioned</text>
  </g>
</svg>
