<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: existing Sanskrit corpora are classical verse while this one is contemporary prose, fifty-three thousand English-Sanskrit sentence pairs benchmarked on four pretrained models" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">English &#8596; Sanskrit</text>
    <text x="286" y="24" text-anchor="end">53k sentence pairs</text>
  </g>

  <!-- ===== what Sanskrit corpora have been: verse ===== -->
  <rect x="14" y="34" width="64" height="76" rx="3" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke="var(--ink-4)" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round">
    <path d="M29 46h34"/><path d="M33 56h26"/><path d="M27 66h38"/><path d="M31 76h30"/>
    <path d="M28 86h36"/><path d="M34 96h24"/>
  </g>

  <path d="M86 72h10 M92 68.5l3.5 3.5-3.5 3.5" fill="none" stroke="var(--ink-4)"
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== what this one is: prose, set flush ===== -->
  <rect x="106" y="34" width="64" height="76" rx="3" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g stroke="var(--teal)" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round">
    <path d="M112 44h52"/><path d="M112 54h52"/><path d="M112 64h52"/><path d="M112 74h52"/>
    <path d="M112 84h52"/><path d="M112 94h52"/><path d="M112 104h34"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" text-anchor="middle">
    <text x="46" y="122" fill="var(--ink-4)">classical verse</text>
    <text x="138" y="122" fill="var(--teal)">S&#257;mayik prose</text>
  </g>

  <!-- ===== the pair, and the models it was benchmarked on ===== -->
  <rect x="182" y="40" width="44" height="20" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="204" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">English</text>
  <rect x="242" y="40" width="44" height="20" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="264" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--saffron)">Sanskrit</text>
  <path d="M229 50h10 M232 46.5l-3.5 3.5 3.5 3.5 M236 53.5l3.5-3.5-3.5-3.5" fill="none"
        stroke="var(--ink-4)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1">
    <rect x="182" y="84" width="18" height="18" rx="4"/><rect x="208" y="84" width="18" height="18" rx="4"/>
    <rect x="234" y="84" width="18" height="18" rx="4"/><rect x="260" y="84" width="18" height="18" rx="4"/>
  </g>
  <g fill="var(--saffron)">
    <circle cx="198" cy="86" r="2.6"/><circle cx="224" cy="86" r="2.6"/><circle cx="250" cy="86" r="2.6"/>
  </g>
  <text x="182" y="122" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">3 of 4 new to Sanskrit</text>

  <line x1="14" y1="134" x2="286" y2="134" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="152" font-size="8.5" fill="var(--ink-3)">contemporary prose, not classical poetry</text>
    <text x="14" y="172" font-size="8" fill="var(--ink-4)">and the gains show on contemporary text</text>
  </g>
</svg>
