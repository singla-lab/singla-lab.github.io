<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a whole-cell model needs input from every subdiscipline, but the data must first be organised, annotated and archived, which is the narrow point the field has to pass through and which no single group can do alone" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">every subdiscipline</text>
    <text x="286" y="16" text-anchor="end">one model of a cell</text>
  </g>

  <!-- ===== what has to come in, and from how many directions ===== -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)">
    <text x="14" y="35">biology</text>
    <text x="14" y="52">chemistry</text>
    <text x="14" y="69">physics</text>
    <text x="14" y="86">computing</text>
  </g>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round">
    <path d="M66 32 C82 32, 88 46, 98 56"/>
    <path d="M70 49 C84 49, 90 52, 98 57"/>
    <path d="M64 66 C80 66, 88 63, 98 59"/>
    <path d="M72 83 C86 83, 90 70, 98 61"/>
  </g>

  <!-- ===== the narrow point: not the modelling, the bookkeeping ===== -->
  <path d="M100 40 L138 54 L138 64 L100 78 Z" fill="var(--saffron-soft)" stroke="var(--saffron)"
        stroke-width="1.3" stroke-linejoin="round"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5" fill="var(--saffron)" text-anchor="middle">
    <text x="119" y="95">organise</text>
    <text x="119" y="104">annotate</text>
    <text x="119" y="113">archive</text>
  </g>

  <path d="M142 59h14 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== the cell, held at several scales at once ===== -->
  <circle cx="222" cy="62" r="42" fill="var(--indigo-soft)" fill-opacity=".55" stroke="var(--indigo)"
          stroke-opacity=".45" stroke-width="1.3"/>
  <circle cx="222" cy="62" r="28" fill="none" stroke="var(--indigo)" stroke-opacity=".35"
          stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="222" cy="62" r="14" fill="var(--surface)" stroke="var(--indigo)" stroke-opacity=".4" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5" text-anchor="middle" fill="var(--indigo)">
    <text x="222" y="30">structure</text>
    <text x="222" y="48">metabolism</text>
    <text x="222" y="65">signalling</text>
  </g>
  <text x="222" y="115" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--ink-4)">dynamic, and multiscale</text>

  <line x1="14" y1="132" x2="286" y2="132" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="150" font-size="8.5" fill="var(--ink-3)">the models are not the hard part</text>
    <text x="14" y="168" font-size="8" fill="var(--ink-4)">the inputs are, and no one lab can hold them</text>
  </g>
</svg>
