<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a single predictive model spanning four scales, from an atom through a molecular complex and an organelle to a whole pancreatic beta cell" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="24" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">one predictive model</text>

  <path d="M20 40 v-6 h260 v6" fill="none" stroke="var(--ink-4)" stroke-opacity=".5" stroke-width="1.2"/>

  <!-- ===== the same cell, asked at four scales ===== -->
  <ellipse cx="44" cy="90" rx="12" ry="5.5" fill="none" stroke="var(--ink-4)"
           stroke-opacity=".45" stroke-width="1.1"/>
  <circle cx="44" cy="90" r="4" fill="var(--ink-4)" fill-opacity=".5"/>

  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2">
    <circle cx="104" cy="86" r="5"/><circle cx="115" cy="84" r="5"/>
    <circle cx="108" cy="95" r="5"/><circle cx="119" cy="93" r="5"/>
  </g>

  <rect x="163" y="84" width="34" height="16" rx="8" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-width="1.3"/>
  <path d="M168 92l4-4 4 8 4-8 4 8 4-8 4 4" fill="none" stroke="var(--saffron)"
        stroke-opacity=".5" stroke-width="1"/>

  <circle cx="250" cy="74" r="26" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1"/>
  <circle cx="242" cy="66" r="9" fill="var(--ink-4)" fill-opacity=".14"/>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1">
    <circle cx="260" cy="82" r="2.6"/><circle cx="248" cy="90" r="2.6"/><circle cx="264" cy="66" r="2.6"/>
  </g>
  <rect x="228" y="82" width="14" height="6" rx="3" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-width="1"/>

  <line x1="20" y1="104" x2="280" y2="104" stroke="var(--rule)" stroke-width="1"/>
  <g stroke="var(--rule)" stroke-width="1">
    <path d="M44 104v4 M110 104v4 M180 104v4 M250 104v4"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-3)"
     text-anchor="middle">
    <text x="44" y="118">atomic</text>
    <text x="110" y="118">molecular</text>
    <text x="180" y="118">organelle</text>
    <text x="250" y="118">cellular</text>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-4)">
    <text x="14" y="118">Å</text>
    <text x="286" y="118" text-anchor="end">µm</text>
  </g>

  <line x1="14" y1="142" x2="286" y2="142" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="160" font-size="8" fill="var(--ink-3)">biology + chemistry + physics + computing</text>
    <text x="14" y="178" font-size="8" fill="var(--ink-4)">a community effort, aimed at diabetes</text>
  </g>
</svg>
