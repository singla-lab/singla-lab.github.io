<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a colonoscopy frame with a polyp inside a detection box, beside the three levers the method tunes — an intersection-over-union loss, data augmentations, and negative frames containing no polyp" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="26" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--ink-4)">colonoscopy frame</text>

  <!-- the lumen, receding, with a polyp on the near wall -->
  <rect x="14" y="34" width="112" height="92" rx="6" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".3" stroke-width="1.1">
    <ellipse cx="74" cy="84" rx="42" ry="34"/>
    <ellipse cx="76" cy="84" rx="29" ry="23"/>
    <ellipse cx="78" cy="84" rx="16" ry="12"/>
  </g>
  <ellipse cx="46" cy="61" rx="13" ry="10" fill="var(--saffron-soft)" stroke="var(--saffron)"
           stroke-width="1.3"/>
  <path d="M42 70 C44 75, 50 75, 52 70" fill="none" stroke="var(--saffron)" stroke-width="1.2"
        stroke-opacity=".7"/>

  <rect x="29" y="46" width="34" height="30" rx="2" fill="none" stroke="var(--teal)"
        stroke-width="1.4" stroke-dasharray="4 2.5"/>
  <text x="29" y="43" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--teal)">polyp</text>

  <!-- ============ the three levers the name spells out ============ -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace">

    <rect x="142" y="36" width="18" height="18" rx="5" fill="var(--indigo-soft)" stroke="var(--indigo)"
          stroke-opacity=".4" stroke-width="1"/>
    <text x="151" y="49" text-anchor="middle" font-size="9.5" fill="var(--indigo)">L</text>
    <text x="168" y="49" font-size="8" fill="var(--ink-2)">M2IoU loss</text>
    <g fill="none" stroke="var(--ink-4)" stroke-width="1.1">
      <rect x="250" y="38" width="22" height="15" rx="2"/>
      <rect x="262" y="42" width="22" height="15" rx="2"/>
    </g>
    <rect x="262" y="42" width="10" height="11" fill="var(--indigo)" fill-opacity=".22"/>

    <rect x="142" y="68" width="18" height="18" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"
          stroke-opacity=".4" stroke-width="1"/>
    <text x="151" y="81" text-anchor="middle" font-size="9.5" fill="var(--teal)">A</text>
    <text x="168" y="81" font-size="8" fill="var(--ink-2)">augmentations</text>
    <g stroke="var(--ink-4)" stroke-width="1" fill="var(--paper-2)">
      <rect x="242" y="68" width="14" height="18" rx="2"/>
      <rect x="260" y="68" width="14" height="18" rx="2" transform="rotate(9 267 77)"/>
      <rect x="278" y="68" width="14" height="18" rx="2" fill="var(--ink-4)" fill-opacity=".18"/>
    </g>
    <g fill="var(--saffron)" fill-opacity=".55">
      <circle cx="249" cy="76" r="2.6"/><circle cx="267" cy="76" r="2.6"/><circle cx="285" cy="76" r="2.6"/>
    </g>

    <rect x="142" y="100" width="18" height="18" rx="5" fill="var(--saffron-soft)" stroke="var(--saffron)"
          stroke-opacity=".4" stroke-width="1"/>
    <text x="151" y="113" text-anchor="middle" font-size="9.5" fill="var(--saffron)">N</text>
    <text x="168" y="113" font-size="8" fill="var(--ink-2)">negative frames</text>
    <rect x="262" y="100" width="22" height="18" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)"
          stroke-width="1"/>
    <g fill="none" stroke="var(--ink-4)" stroke-width="1.3" stroke-opacity=".7">
      <circle cx="273" cy="109" r="5"/><path d="M269.5 105.5l7 7"/>
    </g>
  </g>

  <line x1="14" y1="140" x2="286" y2="140" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="158">Kvasir-seg &#183; BKAI-IGH NeoPolyp</text>
    <text x="286" y="158" text-anchor="end">gains at high IoU</text>
  </g>
</svg>
