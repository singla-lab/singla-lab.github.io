<svg viewBox="0 0 300 190" role="img" aria-label="Sanskrit text is read by a neural model that drives three tools: translation, generation and understanding. The model is trained on the lab's own corpora: Samayik, Samasamayik and RECAST" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="15" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">what the work builds</text>

  <!-- ============ the language itself ============ -->
  <rect x="14" y="28" width="88" height="44" rx="7" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-opacity=".5" stroke-width="1.2"/>
  <text x="58" y="57" text-anchor="middle" font-size="19" fill="var(--warm-ink)"
        font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">&#2360;&#2306;&#2360;&#2381;&#2325;&#2371;&#2340;&#2350;&#2381;</text>

  <g stroke="var(--ink-4)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106 50h13 M115 46l4 4-4 4"/>
  </g>

  <!-- ============ the model, on the same tile motif as the Sanskrit research figure ============ -->
  <rect x="126" y="22" width="76" height="56" rx="8" fill="var(--indigo-soft)"
        stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1.3"/>
  <g fill="var(--indigo)">
    <rect x="134" y="33" width="12" height="8" rx="2" fill-opacity=".55"/>
    <rect x="150" y="33" width="12" height="8" rx="2" fill-opacity=".25"/>
    <rect x="166" y="33" width="12" height="8" rx="2" fill-opacity=".8"/>
    <rect x="182" y="33" width="12" height="8" rx="2" fill-opacity=".35"/>
    <rect x="134" y="45" width="12" height="8" rx="2" fill-opacity=".3"/>
    <rect x="150" y="45" width="12" height="8" rx="2" fill-opacity=".7"/>
    <rect x="166" y="45" width="12" height="8" rx="2" fill-opacity=".4"/>
    <rect x="182" y="45" width="12" height="8" rx="2" fill-opacity=".6"/>
  </g>
  <text x="164" y="70" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">model</text>

  <!-- ============ the fan: one model, three tools ============ -->
  <g stroke="var(--ink-4)" stroke-opacity=".7" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M202 50h12"/>
    <path d="M214 32v96"/>
    <path d="M214 32h12 M214 80h12 M214 128h12"/>
  </g>

  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".45" stroke-width="1.1">
    <rect x="226" y="21" width="60" height="22" rx="6"/>
    <rect x="226" y="69" width="60" height="22" rx="6"/>
    <rect x="226" y="117" width="60" height="22" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.6"
     fill="var(--teal-ink)">
    <text x="256" y="35">translate</text>
    <text x="256" y="83">generate</text>
    <text x="256" y="131">understand</text>
  </g>

  <!-- ============ what it is trained on: the lab's own corpora ============ -->
  <text x="14" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">trained on</text>

  <g fill="var(--surface)" stroke="var(--rule)" stroke-width="1">
    <rect x="14" y="126" width="68" height="20" rx="6"/>
    <rect x="88" y="126" width="94" height="20" rx="6"/>
    <rect x="14" y="152" width="68" height="20" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
     fill="var(--ink-2)">
    <text x="48" y="139">S&#257;mayik</text>
    <text x="135" y="139">Samasamayik</text>
    <text x="48" y="165">RECAST</text>
  </g>
  <text x="90" y="165" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">the lab&#8217;s own corpora</text>

  <g stroke="var(--ink-4)" stroke-opacity=".7" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M143 124V82 M139 86l4-4 4 4"/>
  </g>
</svg>
