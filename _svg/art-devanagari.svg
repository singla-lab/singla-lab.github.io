<svg viewBox="0 0 320 220" role="img" aria-label="Sanskrit tokens passing through an encoder into an embedding grid and out as English" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="296" height="196" rx="10" fill="var(--surface)" stroke="var(--rule)"/>

  <!-- source tokens -->
  <g>
    <rect x="26" y="40" width="52" height="30" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
    <rect x="26" y="80" width="52" height="30" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
    <rect x="26" y="120" width="52" height="30" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
    <text x="52" y="61" text-anchor="middle" font-size="16" fill="var(--warm-ink)" font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">सं</text>
    <text x="52" y="101" text-anchor="middle" font-size="16" fill="var(--warm-ink)" font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">स्कृ</text>
    <text x="52" y="141" text-anchor="middle" font-size="16" fill="var(--warm-ink)" font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">तम्</text>
  </g>
  <text x="52" y="170" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">sandhi-split</text>

  <!-- edges into encoder -->
  <g stroke="var(--saffron)" stroke-opacity=".5" stroke-width="1.1" fill="none">
    <path class="dash-run" d="M78 55 C 100 55, 104 78, 122 82"/>
    <path class="dash-run" d="M78 95 C 100 95, 106 98, 122 100"/>
    <path class="dash-run" d="M78 135 C 100 135, 104 122, 122 118"/>
  </g>

  <!-- encoder block -->
  <rect x="122" y="52" width="72" height="96" rx="8" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.5"/>
  <g fill="var(--indigo)" fill-opacity=".55">
    <rect x="132" y="64" width="12" height="12" rx="2"/><rect x="148" y="64" width="12" height="12" rx="2" fill-opacity=".25"/>
    <rect x="164" y="64" width="12" height="12" rx="2" fill-opacity=".8"/><rect x="180" y="64" width="6" height="12" rx="2" fill-opacity=".35"/>
    <rect x="132" y="82" width="12" height="12" rx="2" fill-opacity=".3"/><rect x="148" y="82" width="12" height="12" rx="2" fill-opacity=".85"/>
    <rect x="164" y="82" width="12" height="12" rx="2" fill-opacity=".2"/><rect x="180" y="82" width="6" height="12" rx="2" fill-opacity=".6"/>
    <rect x="132" y="100" width="12" height="12" rx="2" fill-opacity=".75"/><rect x="148" y="100" width="12" height="12" rx="2" fill-opacity=".35"/>
    <rect x="164" y="100" width="12" height="12" rx="2" fill-opacity=".5"/><rect x="180" y="100" width="6" height="12" rx="2" fill-opacity=".9"/>
    <rect x="132" y="118" width="12" height="12" rx="2" fill-opacity=".2"/><rect x="148" y="118" width="12" height="12" rx="2" fill-opacity=".65"/>
    <rect x="164" y="118" width="12" height="12" rx="2" fill-opacity=".4"/><rect x="180" y="118" width="6" height="12" rx="2" fill-opacity=".25"/>
  </g>
  <text x="158" y="164" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--indigo)">shared encoder</text>

  <!-- edges out -->
  <g stroke="var(--indigo)" stroke-opacity=".45" stroke-width="1.1" fill="none">
    <path class="dash-run" d="M194 78 C 214 78, 220 68, 240 66"/>
    <path class="dash-run" d="M194 100 C 214 100, 220 104, 240 106"/>
    <path class="dash-run" d="M194 122 C 214 122, 220 142, 240 146"/>
  </g>

  <!-- target tokens -->
  <g fill="var(--surface)" stroke="var(--indigo)" stroke-width="1.3">
    <rect x="240" y="52" width="58" height="28" rx="6"/>
    <rect x="240" y="92" width="58" height="28" rx="6"/>
    <rect x="240" y="132" width="58" height="28" rx="6"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="var(--indigo)" text-anchor="middle">
    <text x="269" y="70">the</text>
    <text x="269" y="110">lang-</text>
    <text x="269" y="150">uage</text>
  </g>
  <circle class="pulse-o" cx="269" cy="106" r="4" fill="var(--saffron)" stroke="none"/>
</svg>
