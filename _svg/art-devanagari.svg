<svg viewBox="0 0 320 220" role="img" aria-label="A Sanskrit sentence is translated to English and then reconstructed back to Sanskrit, the agreement between the original and the reconstruction acting as the training anchor" xmlns="http://www.w3.org/2000/svg">
  <rect x="12" y="12" width="296" height="196" rx="10" fill="var(--surface)" stroke="var(--rule)"/>

  <!-- forward pass -->
  <rect x="26" y="44" width="62" height="38" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
  <text x="57" y="70" text-anchor="middle" font-size="17" fill="var(--warm-ink)"
        font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">वाक्यम्</text>

  <g stroke="var(--saffron)" stroke-opacity=".65" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path class="dash-run" d="M90 63H104"/>
    <path d="M101 58l5 5-5 5"/>
  </g>

  <rect x="110" y="40" width="64" height="46" rx="8" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.4"/>
  <g fill="var(--indigo)">
    <rect x="118" y="48" width="10" height="8" rx="2" fill-opacity=".55"/>
    <rect x="131" y="48" width="10" height="8" rx="2" fill-opacity=".25"/>
    <rect x="144" y="48" width="10" height="8" rx="2" fill-opacity=".8"/>
    <rect x="157" y="48" width="9" height="8" rx="2" fill-opacity=".35"/>
    <rect x="118" y="59" width="10" height="8" rx="2" fill-opacity=".3"/>
    <rect x="131" y="59" width="10" height="8" rx="2" fill-opacity=".75"/>
    <rect x="144" y="59" width="10" height="8" rx="2" fill-opacity=".4"/>
    <rect x="157" y="59" width="9" height="8" rx="2" fill-opacity=".6"/>
  </g>
  <text x="142" y="79" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">translate</text>

  <g stroke="var(--saffron)" stroke-opacity=".65" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path class="dash-run" d="M176 63H192"/>
    <path d="M189 58l5 5-5 5"/>
  </g>

  <rect x="196" y="44" width="76" height="38" rx="6" fill="var(--surface)" stroke="var(--indigo)" stroke-width="1.3"/>
  <text x="234" y="68" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="9.5" fill="var(--indigo)">a sentence</text>

  <!-- and back again: the reconstruction is what the loss is anchored on -->
  <g stroke="var(--indigo)" stroke-opacity=".55" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path class="dash-run" d="M234 84V141H182"/>
    <path d="M185 136l-5 5 5 5"/>
  </g>

  <rect x="110" y="120" width="64" height="46" rx="8" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="var(--indigo)">
    <rect x="118" y="128" width="10" height="8" rx="2" fill-opacity=".4"/>
    <rect x="131" y="128" width="10" height="8" rx="2" fill-opacity=".7"/>
    <rect x="144" y="128" width="10" height="8" rx="2" fill-opacity=".3"/>
    <rect x="157" y="128" width="9" height="8" rx="2" fill-opacity=".55"/>
    <rect x="118" y="139" width="10" height="8" rx="2" fill-opacity=".75"/>
    <rect x="131" y="139" width="10" height="8" rx="2" fill-opacity=".35"/>
    <rect x="144" y="139" width="10" height="8" rx="2" fill-opacity=".6"/>
    <rect x="157" y="139" width="9" height="8" rx="2" fill-opacity=".25"/>
  </g>
  <text x="142" y="159" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">reconstruct</text>

  <g stroke="var(--indigo)" stroke-opacity=".55" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path class="dash-run" d="M108 141H94"/>
    <path d="M97 136l-5 5 5 5"/>
  </g>

  <rect x="26" y="122" width="62" height="38" rx="6" fill="none" stroke="var(--saffron)"
        stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="57" y="148" text-anchor="middle" font-size="17" fill="var(--warm-ink)" fill-opacity=".75"
        font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',system-ui,serif">वाक्यम्</text>

  <line x1="57" y1="84" x2="57" y2="120" stroke="var(--ink-4)" stroke-opacity=".5"
        stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="57" cy="102" r="9" fill="var(--surface)"/>
  <text x="57" y="107" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="13" fill="var(--teal)">&#8776;</text>
  <text x="68" y="107" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--teal)">anchor</text>

  <text x="26" y="192" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">Sāmayik &#183; Samasamayik &#183; RECAST</text>
</svg>
