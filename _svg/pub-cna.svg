<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a copy-number change moves the expression of genes at the same locus and of genes far away from it, and a network built on both reconstructs all ten METABRIC breast cancer subtypes, recovering BRF2 as a candidate target" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">one amplified locus</text>
    <text x="286" y="16" text-anchor="end">genes near and far</text>
  </g>

  <!-- ===== the chromosome, with the altered stretch marked ===== -->
  <rect x="14" y="24" width="272" height="11" rx="5" fill="var(--paper-2)" stroke="var(--rule)"/>
  <rect x="56" y="24" width="26" height="11" rx="5" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.2"/>

  <!-- cis: the gene sitting under the change. trans: the ones it reaches across the genome -->
  <path d="M69 37 v13" fill="none" stroke="var(--saffron)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="69" cy="55" r="4.5" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.2"/>
  <text x="69" y="70" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--saffron)">cis</text>

  <g fill="none" stroke="var(--teal)" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round">
    <path d="M78 37 C120 46, 140 48, 162 53"/>
    <path d="M80 37 C140 44, 190 48, 214 53"/>
    <path d="M81 37 C160 42, 230 48, 262 53"/>
  </g>
  <g fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2">
    <circle cx="166" cy="55" r="4.5"/>
    <circle cx="218" cy="55" r="4.5"/>
    <circle cx="266" cy="55" r="4.5"/>
  </g>
  <text x="218" y="70" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--teal)">trans</text>

  <!-- ===== the two kinds of gene the network pulls out ===== -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7">
    <text x="14" y="90" fill="var(--ink-4)">cis</text>
    <rect x="34" y="82" width="92" height="13" rx="4" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-opacity=".5" stroke-width="1"/>
    <text x="80" y="91.5" text-anchor="middle" fill="var(--saffron)">CCND1 ERBB2 MDM2</text>
    <rect x="34" y="99" width="92" height="13" rx="4" fill="none" stroke="var(--saffron)" stroke-width="1.2"/>
    <text x="80" y="108.5" text-anchor="middle" fill="var(--saffron)">BRF2 SF3B3</text>

    <text x="146" y="90" fill="var(--ink-4)">trans</text>
    <rect x="176" y="82" width="110" height="13" rx="4" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5" stroke-width="1"/>
    <text x="231" y="91.5" text-anchor="middle" fill="var(--teal)">immune response</text>
    <rect x="176" y="99" width="110" height="13" rx="4" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5" stroke-width="1"/>
    <text x="231" y="108.5" text-anchor="middle" fill="var(--teal)">mitotic kinases, DDR</text>
  </g>
  <text x="80" y="122" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="6.5" fill="var(--saffron)">new</text>

  <!-- ===== the test: can these genes rebuild the known subtypes ===== -->
  <g fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1">
    <rect x="14" y="132" width="18" height="10" rx="2"/>
    <rect x="36" y="132" width="18" height="10" rx="2"/>
    <rect x="58" y="132" width="18" height="10" rx="2"/>
    <rect x="80" y="132" width="18" height="10" rx="2"/>
    <rect x="102" y="132" width="18" height="10" rx="2"/>
    <rect x="124" y="132" width="18" height="10" rx="2"/>
    <rect x="146" y="132" width="18" height="10" rx="2"/>
    <rect x="168" y="132" width="18" height="10" rx="2"/>
    <rect x="190" y="132" width="18" height="10" rx="2"/>
    <rect x="212" y="132" width="18" height="10" rx="2"/>
  </g>
  <text x="234" y="140" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--indigo)">ten subtypes</text>

  <line x1="14" y1="154" x2="286" y2="154" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="169" font-size="8.5" fill="var(--ink-3)">METABRIC rebuilt, each subtype its own set</text>
    <text x="14" y="183" font-size="8" fill="var(--ink-4)">BRF2 kills ER-/HER2+ cells, spares normal</text>
  </g>
</svg>
