<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: one colonoscopy frame is segmented by a primary model and by an independently trained referee, and the agreement between their two masks decides whether the prediction is kept or rejected; a cross-architecture referee reaches ROC-AUC 0.960 against 0.923 for one differing only in random seed" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">one frame, no ground truth</text>
    <text x="286" y="16" text-anchor="end">keep or reject</text>
  </g>

  <!-- ===== the frame, read twice by two models that never saw each other ===== -->
  <rect x="14" y="23" width="44" height="34" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <ellipse cx="36" cy="40" rx="12" ry="8.5" fill="var(--saffron-soft)" stroke="var(--saffron)"
           stroke-opacity=".7" stroke-width="1.1"/>

  <g fill="none" stroke="var(--ink-4)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 34h10 m-3-3 3 3-3 3"/>
    <path d="M60 46h10 m-3-3 3 3-3 3"/>
  </g>

  <rect x="72" y="24" width="62" height="17" rx="5" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="103" y="35.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--indigo)">primary</text>
  <rect x="72" y="46" width="62" height="17" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-opacity=".5" stroke-width="1.1"/>
  <text x="103" y="57.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" fill="var(--teal)">referee</text>
  <text x="103" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--ink-4)">trained independently</text>

  <!-- the two masks laid over each other: what overlaps is the whole signal -->
  <circle cx="184" cy="37" r="16" fill="var(--indigo-soft)" fill-opacity=".85" stroke="var(--indigo)"
          stroke-opacity=".55" stroke-width="1.2"/>
  <circle cx="204" cy="37" r="16" fill="var(--teal-soft)" fill-opacity=".6" stroke="var(--teal)"
          stroke-opacity=".55" stroke-width="1.2"/>
  <text x="194" y="66" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--ink-3)">agreement Dice</text>

  <g fill="none" stroke="var(--ink-4)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 37h12 m-3-3 3 3-3 3"/>
  </g>
  <rect x="242" y="22" width="44" height="15" rx="5" fill="var(--teal-soft)" stroke="var(--teal)"
        stroke-opacity=".6" stroke-width="1.1"/>
  <text x="264" y="32.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--teal)">keep</text>
  <rect x="242" y="42" width="44" height="15" rx="5" fill="none" stroke="var(--ink-4)"
        stroke-opacity=".5" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="264" y="52.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--ink-4)">reject</text>

  <!-- ===== what the agreement is worth, on the 1,223 image benchmark ===== -->
  <text x="14" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7"
        fill="var(--ink-4)">ROC-AUC, 1,223 external images</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-3)">
    <text x="14" y="103">SegFormer-B0</text>
    <text x="14" y="118">same seed</text>
    <text x="14" y="133">TTA baseline</text>
  </g>
  <g>
    <rect x="96" y="96" width="117.3" height="9" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5" stroke-width="1"/>
    <rect x="96" y="111" width="77.9" height="9" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5" stroke-width="1"/>
    <rect x="96" y="126" width="58.7" height="9" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".45" stroke-width="1"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7">
    <text x="218" y="103" fill="var(--teal)">0.960</text>
    <text x="179" y="118" fill="var(--indigo)">0.923</text>
    <text x="160" y="133" fill="var(--ink-4)">0.905</text>
  </g>

  <line x1="14" y1="148" x2="286" y2="148" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="164" font-size="8.5" fill="var(--ink-3)">independence alone already works</text>
    <text x="14" y="180" font-size="8" fill="var(--ink-4)">one extra forward pass, no labels</text>
  </g>
</svg>
