<svg viewBox="0 0 300 190" role="img" aria-label="What the IndiaAI PhD Fellowship provides each year, drawn to scale: a monthly stipend of seventy to eighty thousand rupees, which annualises to between 8.4 and 9.6 lakh; an annual research grant of two lakh; and conference travel support capped at one lakh" xmlns="http://www.w3.org/2000/svg">

  <text x="14" y="15" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8"
        fill="var(--ink-4)">what it covers, per year</text>

  <!-- ============ stipend: the recurring one, and the only one with a range ============ -->
  <text x="14" y="36" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--indigo)">stipend</text>
  <text x="286" y="36" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.8" fill="var(--ink-3)">&#8377;70,000&#8211;80,000 / month</text>

  <!-- the dashed extent is the top of the band; the fill is the bottom of it -->
  <rect x="14" y="41" width="261.1" height="13" rx="4" fill="none" stroke="var(--indigo)"
        stroke-opacity=".4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="14" y="41" width="228.5" height="13" rx="4" fill="var(--indigo-soft)"
        stroke="var(--indigo)" stroke-opacity=".45" stroke-width="1.1"/>

  <!-- ============ research grant ============ -->
  <text x="14" y="80" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--teal)">research grant</text>
  <text x="286" y="80" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.8" fill="var(--ink-3)">&#8377;2 lakh / year</text>
  <rect x="14" y="85" width="54.4" height="13" rx="4" fill="var(--teal-soft)"
        stroke="var(--teal)" stroke-opacity=".45" stroke-width="1.1"/>

  <!-- ============ travel ============ -->
  <text x="14" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5"
        fill="var(--saffron)">conference travel</text>
  <text x="286" y="124" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.8" fill="var(--ink-3)">up to &#8377;1 lakh</text>
  <rect x="14" y="129" width="27.2" height="13" rx="4" fill="var(--saffron-soft)"
        stroke="var(--saffron)" stroke-opacity=".5" stroke-width="1.1"/>

  <!-- ============ the scale, so the bars are read as quantities and not decoration ============ -->
  <g stroke="var(--rule)" stroke-width="1">
    <path d="M14 157h272"/>
    <path d="M14 157v4 M150 157v4 M286 157v4"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-4)">
    <text x="14" y="171">0</text>
    <text x="150" y="171" text-anchor="middle">&#8377;5L</text>
    <text x="286" y="171" text-anchor="end">&#8377;10L</text>
  </g>

  <text x="14" y="185" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">stipend annualised &#215;12 &#183; travel is a ceiling</text>
</svg>
