<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: models of different kinds and scales are converted, coupled and harmonized into a single metamodel that reconciles inputs which disagree with one another" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="var(--ink-4)">
    <text x="14" y="24">heterogeneous inputs</text>
    <text x="286" y="24" text-anchor="end">one metamodel</text>
  </g>

  <!-- ===== each input is a different kind of thing ===== -->
  <rect x="14" y="32" width="84" height="64" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--ink-4)" fill-opacity=".4">
    <rect x="28" y="44" width="4" height="4"/><rect x="35" y="44" width="4" height="4"/>
    <rect x="42" y="44" width="4" height="4"/><rect x="28" y="51" width="4" height="4"/>
    <rect x="35" y="51" width="4" height="4"/><rect x="42" y="51" width="4" height="4"/>
    <rect x="28" y="58" width="4" height="4"/><rect x="35" y="58" width="4" height="4"/>
    <rect x="42" y="58" width="4" height="4"/>
  </g>
  <g fill="var(--ink-4)" fill-opacity=".45" stroke="var(--ink-4)" stroke-opacity=".45" stroke-width="1">
    <circle cx="68" cy="44" r="2.5"/><circle cx="84" cy="47" r="2.5"/>
    <circle cx="70" cy="59" r="2.5"/><circle cx="84" cy="59" r="2.5"/>
  </g>
  <path d="M68 44 L84 47 L70 59 L84 59" fill="none" stroke="var(--ink-4)" stroke-opacity=".4"
        stroke-width="1"/>
  <path d="M26 88 C32 70, 40 92, 48 74" fill="none" stroke="var(--ink-4)" stroke-opacity=".5"
        stroke-width="1.4"/>
  <path d="M64 86 q5 -12 10 0 q5 12 10 0" fill="none" stroke="var(--ink-4)" stroke-opacity=".5"
        stroke-width="1.4"/>

  <g fill="none" stroke="var(--ink-4)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 64h10 M110 60.5l3.5 3.5-3.5 3.5"/>
    <path d="M206 64h10 M212 60.5l3.5 3.5-3.5 3.5"/>
  </g>

  <g fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".45" stroke-width="1.2">
    <rect x="120" y="34" width="80" height="18" rx="5"/>
    <rect x="120" y="56" width="80" height="18" rx="5"/>
    <rect x="120" y="78" width="80" height="18" rx="5"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--indigo)"
     text-anchor="middle">
    <text x="160" y="47">1 convert</text>
    <text x="160" y="69">2 couple</text>
    <text x="160" y="91">3 harmonize</text>
  </g>

  <rect x="222" y="32" width="64" height="64" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <g fill="var(--ink-4)" fill-opacity=".35">
    <circle cx="236" cy="48" r="1.8"/><circle cx="254" cy="48" r="1.8"/><circle cx="272" cy="48" r="1.8"/>
    <circle cx="236" cy="64" r="1.8"/><circle cx="254" cy="64" r="1.8"/><circle cx="272" cy="64" r="1.8"/>
    <circle cx="236" cy="80" r="1.8"/><circle cx="254" cy="80" r="1.8"/><circle cx="272" cy="80" r="1.8"/>
  </g>
  <path d="M236 48 L254 64 L272 80" fill="none" stroke="var(--teal)" stroke-opacity=".5" stroke-width="1"/>
  <path d="M230 84 C242 52, 262 92, 278 54" fill="none" stroke="var(--teal)" stroke-width="1.6"/>

  <line x1="14" y1="106" x2="286" y2="106" stroke="var(--rule)" stroke-width="1"/>

  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="124" font-size="8" fill="var(--ink-4)">conflicting inputs, reconciled</text>
    <text x="14" y="146" font-size="8.5" fill="var(--ink-3)">each input keeps its own scale</text>
    <text x="14" y="166" font-size="8" fill="var(--ink-4)">insulin secretion, β cells</text>
  </g>

  <line x1="176" y1="164" x2="282" y2="164" stroke="var(--rule)" stroke-width="1"/>
  <g fill="none" stroke="var(--ink-4)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="3 2">
    <path d="M180 158 C204 136, 240 122, 276 116"/>
    <path d="M180 158 C204 152, 240 148, 276 148"/>
  </g>
  <path d="M180 158 C204 144, 240 134, 276 130" fill="none" stroke="var(--teal)" stroke-width="1.8"/>
  <text x="176" y="180" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">inputs vs harmonized</text>
</svg>
