<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: a peptide sequence is reduced to 330 interpretable descriptors, of which ten physicochemical scalars alone recover 91 per cent of the performance; a tabular foundation model reads them in context in one forward pass and returns five activity labels, reaching 77.8 mean average precision against 72.1 for the previous best" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">peptide sequence</text>
    <text x="286" y="16" text-anchor="end">82,359 peptides</text>
  </g>

  <!-- ===== the only input: residues. no structure, predicted or otherwise ===== -->
  <rect x="14" y="22" width="272" height="15" rx="4" fill="var(--paper-2)" stroke="var(--rule)"/>
  <text x="150" y="32.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8" letter-spacing="1.6" fill="var(--ink-3)">GIGKFLHSAKKFGKAFVGEIMNS</text>

  <path d="M150 39v6 m-3-3 3 3 3-3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 330 columns, drawn to scale: the eight families are wildly uneven ===== -->
  <text x="14" y="55" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5"
        fill="var(--ink-4)">330 interpretable descriptors</text>

  <g stroke-width="1.1">
    <rect x="14" y="60" width="105.5" height="14" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".45"/>
    <rect x="119.5" y="60" width="121.2" height="14" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".45"/>
    <rect x="240.7" y="60" width="16.5" height="14" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".5"/>
    <rect x="257.2" y="60" width="12.4" height="14" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".5"/>
    <rect x="269.6" y="60" width="8.2" height="14" rx="2" fill="var(--saffron-soft)" stroke="var(--saffron)"/>
    <rect x="277.8" y="60" width="8.2" height="14" rx="2" fill="var(--paper-2)" stroke="var(--ink-4)" stroke-opacity=".5"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" text-anchor="middle">
    <text x="66.8" y="69.5" fill="var(--indigo)">ESM 128</text>
    <text x="180.1" y="69.5" fill="var(--teal)">CTD 147</text>
  </g>

  <!-- the ten scalars are the paper's whole point, so they get the colour and the leader -->
  <path d="M273.7 75v7 h-50" fill="none" stroke="var(--saffron)" stroke-width="1"
        stroke-opacity=".8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="219" y="84.5" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7.5" fill="var(--saffron)">10 scalars alone: 91%</text>

  <path d="M150 90v7 m-3-3 3 3 3-3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== no gradient reaches this box: the labelled peptides ride in as context ===== -->
  <rect x="62" y="101" width="176" height="21" rx="6" fill="var(--indigo-soft)" stroke="var(--indigo)"
        stroke-opacity=".55" stroke-width="1.2"/>
  <text x="150" y="115" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--indigo)">TabPFN, one forward pass</text>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-4)">
    <text x="14" y="109">labelled</text>
    <text x="14" y="119.5">peptides</text>
  </g>
  <path d="M50 112h8 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M150 124v7 m-3-3 3 3 3-3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-2)"
     text-anchor="middle">
    <text x="150" y="140">antibacterial &#183; antifungal &#183; antiviral</text>
    <text x="150" y="151">antiparasitic &#183; antimicrobial</text>
  </g>

  <line x1="14" y1="157" x2="286" y2="157" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="171" font-size="8.5" fill="var(--ink-3)">mAP-5 77.8, against 72.1 before</text>
    <text x="14" y="184" font-size="8" fill="var(--ink-4)">no gradients &#183; no tuning &#183; no structure</text>
  </g>
</svg>
