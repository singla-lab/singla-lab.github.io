<svg viewBox="0 0 300 190" role="img" aria-label="Graphical summary: two genes altered in tumours but almost never in the same tumour are read as a synthetic lethal pair, and applying this across 3,980 tumours yields 718 candidates against six DNA-damage response genes, which land in the top quartile of essentiality in DNA-damage-repair-deficient cell lines" xmlns="http://www.w3.org/2000/svg">

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="var(--ink-4)">
    <text x="14" y="16">altered across tumours</text>
    <text x="286" y="16" text-anchor="end">but never together</text>
  </g>

  <!-- ===== two rows, one tumour per column: the gap in one is filled by the other ===== -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7" fill="var(--ink-3)">
    <text x="14" y="34">gene A</text>
    <text x="14" y="50">gene B</text>
  </g>
  <g stroke-width="1">
    <rect x="52" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="68" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="84" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="100" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="116" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="132" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="148" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="164" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="180" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="196" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="212" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="228" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="244" y="26" width="13" height="10" rx="2" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-opacity=".5"/>
    <rect x="260" y="26" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>

    <rect x="52" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="68" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="84" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="100" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="116" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="132" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="148" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="164" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="180" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="196" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="212" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
    <rect x="228" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="244" y="42" width="13" height="10" rx="2" fill="var(--paper-2)" stroke="var(--rule)"/>
    <rect x="260" y="42" width="13" height="10" rx="2" fill="var(--teal-soft)" stroke="var(--teal)" stroke-opacity=".5"/>
  </g>
  <text x="163" y="64" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="7" fill="var(--ink-4)">3,980 tumours, four cancers</text>

  <!-- ===== a pair a cell cannot afford to lose twice ===== -->
  <path d="M163 70v8 m-3-3 3 3 3-3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="82" width="134" height="20" rx="6" fill="var(--saffron-soft)" stroke="var(--saffron)" stroke-width="1.3"/>
  <text x="163" y="95.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="8.5" fill="var(--saffron)">a lethal combination</text>

  <!-- ===== and the check: are they actually essential where it matters ===== -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="var(--ink-3)">
    <text x="14" y="120">718 genes</text>
    <text x="118" y="120">six DDR genes</text>
  </g>
  <path d="M84 117h24 m-3-3 3 3-3 3" fill="none" stroke="var(--ink-4)" stroke-width="1.1"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="14" y="128" width="272" height="10" rx="3" fill="var(--paper-2)" stroke="var(--rule)"/>
  <rect x="218" y="128" width="68" height="10" rx="3" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.2"/>
  <text x="252" y="136" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="6.5" fill="var(--teal)">top quartile</text>
  <text x="14" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="6.5"
        fill="var(--ink-4)">essentiality, ten DDR-deficient lines</text>

  <line x1="14" y1="156" x2="286" y2="156" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="14" y="170" font-size="8.5" fill="var(--ink-3)">inferred from tumours, not from yeast</text>
    <text x="14" y="184" font-size="8" fill="var(--ink-4)">TLK2 among the targets it recovers</text>
  </g>
</svg>
